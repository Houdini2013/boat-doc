<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:#f7f7f5}
img{max-width:100%}
[hidden]{display:none !important}
</style>
</head>
<body>
<title>Boatsdoc Partnerrechner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#EAECE8; --card:#FFFFFF; --card-2:#F4F5F2;
  --ink:#10201F; --ink-2:#3D4F4E; --ink-3:#6B7C7A;
  --line:#CDD3CF; --line-2:#DFE3DF;
  --deep:#12302F; --deep-ink:#E8EDE9;
  --accent:#C24A21; --accent-soft:#F6E2D9;
  --good:#256B4E; --good-soft:#DDEBE2;
  --warn:#9A6A12; --bad:#8C3A2E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme: dark;
  --paper:#0B1614; --card:#132321; --card-2:#0F1D1B;
  --ink:#E6EBE7; --ink-2:#AFBDB8; --ink-3:#7E8F8A;
  --line:#263B37; --line-2:#1C2E2B;
  --deep:#081210; --deep-ink:#E6EBE7;
  --accent:#E2714A; --accent-soft:#3A1F14;
  --good:#5CB88C; --good-soft:#12291F; --warn:#D4A24A; --bad:#E08476;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0B1614; --card:#132321; --card-2:#0F1D1B;
  --ink:#E6EBE7; --ink-2:#AFBDB8; --ink-3:#7E8F8A;
  --line:#263B37; --line-2:#1C2E2B;
  --deep:#081210; --deep-ink:#E6EBE7;
  --accent:#E2714A; --accent-soft:#3A1F14;
  --good:#5CB88C; --good-soft:#12291F; --warn:#D4A24A; --bad:#E08476;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Source Sans 3", ui-sans-serif, system-ui, sans-serif; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Archivo", ui-sans-serif, system-ui, sans-serif; margin:0; text-wrap:balance; letter-spacing:-.02em; line-height:1.13}
h1{font-size:clamp(1.7rem,4.2vw,2.5rem); font-weight:800}
h2{font-size:clamp(1.24rem,3vw,1.78rem); font-weight:700}
h3{font-size:1rem; font-weight:700}
p{margin:0}
img,video{max-width:100%}
.num{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}

.rail{position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  background:color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line-2)}
.rail-in{max-width:1140px; margin:0 auto; padding:9px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.brand{font-family:"Archivo"; font-weight:800; font-size:.92rem; letter-spacing:-.02em; display:flex; align-items:center; gap:7px; white-space:nowrap}
.brand i{width:9px;height:9px;background:var(--accent);border-radius:2px;display:inline-block;transform:rotate(45deg)}
.steps{display:flex; gap:2px; flex:1; min-width:180px; flex-wrap:wrap}
.stepdot{font-family:"IBM Plex Mono",monospace; font-size:.63rem; padding:4px 8px; border-radius:100px;
  color:var(--ink-3); background:transparent; border:1px solid transparent; cursor:pointer; white-space:nowrap}
.stepdot[aria-current="true"]{background:var(--deep); color:var(--deep-ink); border-color:var(--deep)}
.stepdot.done{color:var(--ink-2); border-color:var(--line)}
#lang{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:.7rem; padding:5px 8px; border-radius:2px;
  border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer}

.wrap{max-width:1140px; margin:0 auto; padding-inline:16px; padding-block:26px 88px}
section[data-step]{animation:rise .3s ease-out}
@keyframes rise{from{opacity:.45; transform:translateY(5px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){section[data-step]{animation:none}}
.sec-head{display:flex; flex-direction:column; gap:6px; margin-bottom:20px}
.lede{max-width:62ch; color:var(--ink-2); font-size:1rem; margin-top:8px}

.pgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(224px,1fr)); gap:11px; margin-top:22px}
.pcard{text-align:left; background:var(--card); border:1px solid var(--line); border-radius:3px; padding:16px;
  cursor:pointer; font:inherit; color:inherit; display:flex; flex-direction:column; gap:7px; transition:border-color .15s, transform .15s}
.pcard:hover{border-color:var(--ink-3); transform:translateY(-2px)}
.pcard[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.pcard .who{font-size:.86rem; color:var(--ink-2)}
.ptag{font-family:"IBM Plex Mono",monospace; font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
  background:var(--accent-soft); padding:2px 6px; border-radius:2px; align-self:flex-start}

.panel{background:var(--card); border:1px solid var(--line); border-radius:3px; padding:20px}
.panel.dark{background:var(--deep); color:var(--deep-ink); border-color:var(--deep)}
.panel.dark .eyebrow{color:color-mix(in srgb,var(--deep-ink) 58%, transparent)}
.panel.dark h2,.panel.dark h3{color:var(--deep-ink)}
.panel.dark p{color:color-mix(in srgb,var(--deep-ink) 84%, transparent)}
.cols{display:grid; gap:14px}
@media(min-width:880px){ .cols.two{grid-template-columns:1fr 1fr} .cols.side{grid-template-columns:330px 1fr} }

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px}
.field > label{font-size:.82rem; font-weight:600; color:var(--ink-2); display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.field .val{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:.92rem; color:var(--ink); font-weight:500}
input[type=range]{width:100%; accent-color:var(--accent); height:22px}
.seg{display:flex; flex-wrap:wrap; gap:5px}
.seg button{font:inherit; font-size:.8rem; padding:6px 11px; border-radius:2px; cursor:pointer;
  border:1px solid var(--line); background:var(--card-2); color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.hint{font-size:.77rem; color:var(--ink-3)}

.flow{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:3px; overflow:hidden}
@media(min-width:760px){ .flow{grid-template-columns:repeat(4,1fr)} }
.fstep{background:var(--card); padding:18px; display:flex; flex-direction:column; gap:7px}
.fstep .n{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--accent); font-weight:600}
.fstep h3{font-size:.98rem}
.fstep p{font-size:.85rem; color:var(--ink-2)}
.fstep .who{margin-top:auto; padding-top:8px; border-top:1px solid var(--line-2); font-family:"IBM Plex Mono",monospace;
  font-size:.6rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}

.vcards{display:grid; gap:12px}
@media(min-width:900px){ .vcards{grid-template-columns:repeat(3,1fr)} }
.vcard{background:var(--card); border:1px solid var(--line); border-radius:3px; padding:18px; display:flex; flex-direction:column; gap:0}
.vcard.win{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.vcard .vh{display:flex; flex-direction:column; gap:3px; margin-bottom:12px}
.vcard .vh h3{font-size:1.05rem}
.vrow{display:grid; grid-template-columns:100px 1fr; gap:4px 10px; font-size:.85rem; padding:8px 0; border-top:1px solid var(--line-2)}
.vrow b{font-family:"IBM Plex Mono",monospace; font-size:.61rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500; padding-top:2px}
.vrow span{color:var(--ink-2)}
.vrow span.neg{color:var(--bad)}
.vres{margin-top:12px; padding:12px 13px; border-radius:2px; background:var(--card-2); border-left:2px solid var(--ink-3); font-size:.86rem}
.vres.good{background:var(--good-soft); border-left-color:var(--good)}
.vres.bad{background:color-mix(in srgb,var(--bad) 10%, transparent); border-left-color:var(--bad)}
.vres b{display:block; font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); margin-bottom:4px}

.vidgrid{display:grid; gap:14px}
@media(min-width:880px){ .vidgrid{grid-template-columns:1fr 1fr} }
.vidcard{border:1px solid var(--line); border-radius:3px; background:var(--card); overflow:hidden; display:flex; flex-direction:column}
.vidcard .vtop{background:#000; display:flex; justify-content:center; max-height:420px}
.vidcard video{display:block; width:100%; height:auto; object-fit:contain; max-height:420px}
.vidcard .vtxt{padding:16px; display:flex; flex-direction:column; gap:7px}
.vidcard .vtxt p{font-size:.88rem; color:var(--ink-2)}

.device{border:1px solid var(--line); border-radius:3px; background:var(--card-2); overflow:hidden}
.device-bar{display:flex; align-items:center; gap:10px; padding:8px 13px; background:var(--deep); color:var(--deep-ink);
  font-family:"IBM Plex Mono",monospace; font-size:.64rem; letter-spacing:.09em; text-transform:uppercase}
.tabs{margin-left:auto; display:flex; gap:4px}
.tabs button{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.08em; text-transform:uppercase;
  padding:4px 10px; border-radius:2px; cursor:pointer; background:transparent; color:color-mix(in srgb,var(--deep-ink) 65%, transparent);
  border:1px solid color-mix(in srgb,var(--deep-ink) 22%, transparent)}
.tabs button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.device-body{padding:18px}
.price-out{border:1px solid var(--line); border-radius:3px; background:var(--card); padding:16px}
.price-big{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:clamp(1.38rem,3.9vw,1.9rem); font-weight:600; letter-spacing:-.03em; line-height:1.1}
.rate-line{margin-top:10px; padding:11px 13px; background:var(--good-soft); border-left:2px solid var(--good); font-size:.86rem}
.rate-line .r{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:1.05rem; color:var(--good)}
.bd{width:100%; border-collapse:collapse; margin-top:12px; font-size:.84rem}
.bd td{padding:6px 0; border-bottom:1px solid var(--line-2); vertical-align:baseline}
.bd td:last-child{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:12px}
.bd tr:last-child td{border-bottom:none; font-weight:600}
.gmp{margin-top:12px; padding:10px 12px; background:var(--accent-soft); border-left:2px solid var(--accent); font-size:.82rem}

.doc{background:var(--card); border:1px solid var(--line); border-radius:2px; padding:22px; font-size:.85rem}
.doc-head{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:12px}
.doc-head .l{font-family:"Archivo"; font-weight:800; font-size:1.1rem; letter-spacing:-.02em}
.doc-head .m{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-3); text-align:right; line-height:1.6}
.doc h4{font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin:18px 0 7px; font-weight:500}
.doc table{width:100%; border-collapse:collapse; font-size:.84rem}
.doc table td{padding:7px 0; border-bottom:1px solid var(--line-2); vertical-align:baseline}
.doc table td:last-child{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:12px}
.doc table tr.t td{border-bottom:none; border-top:2px solid var(--ink); font-weight:700; font-size:1rem; padding-top:9px}
.doc .obj{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px}
.doc .obj div{font-size:.82rem}
.doc .obj b{display:block; font-family:"IBM Plex Mono",monospace; font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
.doc .terms{font-size:.78rem; color:var(--ink-2); display:flex; flex-direction:column; gap:5px}
.doc .pay{display:grid; gap:8px; grid-template-columns:1fr 1fr; margin-top:6px}
.doc .pay div{border:1px solid var(--line); border-radius:2px; padding:11px}
.doc .pay .sel{border-color:var(--good); background:var(--good-soft)}
.doc .pay b{display:block; font-family:"IBM Plex Mono",monospace; font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px}
.doc .pay span{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:1.02rem}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.kpi{background:var(--card); padding:15px}
.kpi .k{font-family:"IBM Plex Mono",monospace; font-size:.61rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.kpi .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:1.38rem; font-weight:600; letter-spacing:-.03em; margin-top:4px; line-height:1.1}
.kpi .s{font-size:.75rem; color:var(--ink-3); margin-top:3px}
.kpi.hi .v{color:var(--good)}

.spot{border-left:2px solid var(--accent); padding:15px 17px; background:var(--card);
  border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); border-radius:0 3px 3px 0}
.spot .big{font-family:"Archivo"; font-size:clamp(1.1rem,2.7vw,1.45rem); font-weight:700; letter-spacing:-.02em; line-height:1.2}
.spot p{margin-top:7px; font-size:.88rem; color:var(--ink-2); max-width:62ch}

table.plain{width:100%; border-collapse:collapse; font-size:.86rem}
table.plain th{text-align:left; font-family:"IBM Plex Mono",monospace; font-size:.61rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:0 0 8px}
table.plain td{padding:7px 0; border-top:1px solid var(--line-2); vertical-align:baseline}
table.plain th:nth-child(n+2), table.plain td:nth-child(n+2){text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:10px}
table.plain tr.sum td{border-top:1px solid var(--ink-3); font-weight:600}
table.reg td{border-top:1px solid var(--line-2); padding:8px 0}
table.reg td:first-child{width:150px; font-family:"Archivo"; font-weight:700; font-size:.85rem}
table.reg td:nth-child(2){text-align:left; font-family:inherit; padding-left:14px; white-space:normal; color:var(--ink-2)}
.scroller{overflow-x:auto}

.specs{display:grid; gap:4px 12px; grid-template-columns:120px 1fr; font-size:.86rem; margin-top:10px}
.specs b{font-family:"IBM Plex Mono",monospace; font-size:.61rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500; padding-top:2px}
.specs span{color:var(--ink-2)}
@media(min-width:760px){.specs2{grid-template-columns:120px 1fr 120px 1fr}}

.tiers{display:grid; gap:12px}
@media(min-width:900px){ .tiers{grid-template-columns:1fr 2fr} }
.devs{display:grid; gap:10px}
@media(min-width:620px){ .devs{grid-template-columns:1fr 1fr} }
.dev{border:1px solid var(--line); border-radius:3px; padding:13px; background:var(--card-2); display:flex; flex-direction:column; gap:9px}
.dev.hd{border-color:var(--accent)}
.dev .dh{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.dev .dh h3{font-size:1.1rem}
.dev .dh .pct{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:1.05rem; color:var(--good); white-space:nowrap}
.dev .dp{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:1.45rem; font-weight:600; letter-spacing:-.03em; line-height:1}
.dev .specs{grid-template-columns:86px 1fr; font-size:.79rem; margin-top:0; gap:3px 8px}
.dev .specs b{font-size:.56rem}
.drate{margin-top:auto; padding-top:9px; border-top:1px solid var(--line-2); display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.78rem; color:var(--ink-3)}
.drate b{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:1.05rem; color:var(--accent); font-weight:600; white-space:nowrap}
.syscards{display:grid; gap:12px; margin-top:12px}
@media(min-width:880px){ .syscards{grid-template-columns:1fr 1fr} }
.syscard{border:1px solid var(--line); border-radius:3px; padding:16px; background:var(--card-2); display:flex; flex-direction:column; gap:10px}
.syscard.hd{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.sc-top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.sc-top h3{font-size:1.3rem; margin-top:4px}
.save{display:flex; flex-direction:column; align-items:flex-end; text-align:right; max-width:52%}
.save .pct{font-family:"IBM Plex Mono",monospace; font-size:1.8rem; font-weight:600; color:var(--good); line-height:1; letter-spacing:-.03em; white-space:nowrap}
.save .ps{font-size:.72rem; color:var(--ink-3); margin-top:4px; line-height:1.3}
.sc-use{font-size:.88rem; color:var(--ink-2)}
.syscard .specs{margin-top:0}
.sc-price{margin-top:auto; padding-top:10px; border-top:1px solid var(--line-2); display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:.8rem; color:var(--ink-3)}
.sc-price b{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:1.3rem; color:var(--ink); font-weight:600; letter-spacing:-.02em}
table.train td:first-child{padding-right:8px}
table.train td:first-child b{display:block; font-weight:600; color:var(--ink)}
table.train td:first-child small{display:block; font-size:.78rem; color:var(--ink-3); margin-top:2px; line-height:1.4}
table.train td small.u{display:block; font-family:"Source Sans 3",sans-serif; font-size:.72rem; color:var(--ink-3); white-space:normal}
.gchips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.gchips span{font-family:"IBM Plex Mono",monospace; font-size:.7rem; padding:4px 10px; border:1px solid var(--line); border-radius:100px; color:var(--ink-2); background:var(--card-2)}
.tier{background:var(--card); border:1px solid var(--line); border-radius:3px; padding:20px; display:flex; flex-direction:column; gap:11px}
.tier.mid{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.tier.top{background:var(--deep); color:var(--deep-ink); border-color:var(--deep)}
.tier.top .eyebrow{color:color-mix(in srgb,var(--deep-ink) 60%, transparent)}
.tier.top .sub{color:color-mix(in srgb,var(--deep-ink) 72%, transparent)}
.tier.top ul{color:color-mix(in srgb,var(--deep-ink) 82%, transparent)}
.tier.top .meta{border-color:color-mix(in srgb,var(--deep-ink) 20%, transparent); color:color-mix(in srgb,var(--deep-ink) 70%, transparent)}
.tier .amt{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:1.65rem; font-weight:600; letter-spacing:-.03em; line-height:1}
.tier .sub{font-size:.8rem; color:var(--ink-3)}
.tier ul{margin:0; padding-left:16px; font-size:.85rem; color:var(--ink-2); display:flex; flex-direction:column; gap:5px}
.tier .meta{margin-top:auto; padding-top:10px; border-top:1px solid var(--line-2); font-size:.8rem; color:var(--ink-3)}

.flag{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.57rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--warn); border:1px solid var(--warn); padding:1px 5px; border-radius:2px; vertical-align:middle}
details.ass{margin-top:14px; border:1px solid var(--line-2); border-radius:3px; background:var(--card-2)}
details.ass summary{cursor:pointer; padding:10px 13px; font-size:.82rem; font-weight:600; color:var(--ink-2); list-style:none}
details.ass summary::-webkit-details-marker{display:none}
details.ass summary::before{content:"▸ "; color:var(--accent)}
details.ass[open] summary::before{content:"▾ "}
details.ass .inner{padding:0 13px 13px; font-size:.83rem; color:var(--ink-2)}
details.ass .inner p+p{margin-top:8px}

a{color:var(--accent)}
.nav{display:flex; gap:9px; margin-top:26px; flex-wrap:wrap}
.btn{font:inherit; font-family:"Archivo"; font-weight:600; font-size:.92rem; padding:11px 20px; border-radius:2px; cursor:pointer;
  border:1px solid var(--ink); background:var(--ink); color:var(--paper)}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn.go{background:var(--accent); border-color:var(--accent); color:#fff}

 steps:["1 Wer","2 Verfahren","3 Rechner","4 Plattform","5 Rechnung","6 Partner"],
 "btn.next":"Weiter","btn.back":"Zurück","btn.restart":"Von vorn",
 "s0.eye":"Partnerrechner · Antifouling",
 "s0.h":"Altes Antifouling runter, neuer Aufbau drauf.<br>Ein Auftrag, 9.000 Euro, alle sieben Jahre je Boot.",
 "s0.l":"Wir machen genau diese eine Sache — mit gepulstem Laser. Sie bekommen die Plattform, die den Auftrag verkauft: Preis in 40 Sekunden, Angebot automatisch, Ratenzahlung für den Eigner.",
 "p.tag":"Ihr Fall",
 "p.marina.n":"Marina / Winterlager","p.marina.w":"180 Boote am Steg. Jedes ist alle sieben Jahre fällig. Heute verdienen Sie an keinem davon.",
 "p.werft.n":"Bootsbauer / Werft","p.werft.w":"Schleifen blockiert Halle und Leute für die Arbeit mit der schlechtesten Marge.",
 "p.shop.n":"Bootsshop / Händler","p.shop.w":"Sie verkaufen die Farbe. Die Arbeit daran macht ein anderer — oder keiner.",
 "p.gruender.n":"Gründung / Quereinstieg","p.gruender.w":"Erstes Jahr durchgerechnet: Investition, Rate, Aufträge, Break-even.",
 "s1.eye":"Schritt 2 · Das Verfahren","s1.h":"Drei Wege, Antifouling zu entfernen",
 "s1.l":"Referenz: 33 m² Unterwasserfläche, 10-Meter-Rumpf, 10–15 Altschichten. Die Werte für Chemie und Schleifen stammen aus einem dokumentierten Praxisbericht an genau dieser Fläche.",
 "s1.m1":"Verfahren 1","s1.m2":"Verfahren 2","s1.m3":"Verfahren 3",
 "s1.c1t":"Chemisch abbeizen","s1.c2t":"Schleifen","s1.c3t":"Gepulster Laser",
 "s1.rTime":"Arbeitszeit","s1.rMat":"Material","s1.rWx":"Wetter","s1.rSite":"Vor Ort","s1.rWaste":"Abfall","s1.rRes":"Ergebnis",
 "s1.c1a":"38 Std für 33 m²","s1.c1b":"35 kg Abbeizer, rund 500 €","s1.c1c":"erst über 15 °C — Mai bis September",
 "s1.c1d":"klebrige Rückstände an Werkzeug und Kleidung, starker Geruch","s1.c1e":"rund 120 kg, flüssig bis pastös",
 "s1.c1r":"Nach 38 Stunden war die Hälfte der Altschichten noch drauf. Nachschleifen zwingend. Der Verfasser des Praxisberichts rät vom Verfahren ab.",
 "s1.c2a":"60 Std plus 5 Std an Kiel, Ruder, Skeg","s1.c2b":"rund 200 Schleifscheiben","s1.c2c":"ganzjährig",
 "s1.c2d":"biozidhaltiger Feinstaub, Atemschutz und Absaugung zwingend, Nachbarplätze abdecken","s1.c2e":"35–80 kg Staub plus Schleifmittel",
 "s1.c2r":"Vollständig entfernt, aber gelcoatnah heikel — weiches Antifouling setzt die Scheiben binnen Minuten zu. Werftpreis für reine Entfernung: 2.265–2.961 € bei 30–33 m².",
 "s1.c3a":"6–11 Std, eine Person","s1.c3b":"keines, nur Strom","s1.c3c":"ganzjährig",
 "s1.c3d":"kein Staub, Absaugung sitzt am Kopf, Nachbarplätze bleiben frei","s1.c3e":"15–50 kg Filterrückstand",
 "s1.c3r":"Schicht für Schicht abgetragen, Abtragstiefe über Pulsenergie und Vorschub geregelt. Der Untergrund bleibt unbeschädigt — beide Videos unten zeigen genau das.",
 "s1.proofH":"Der Beweis","s1.proofL":"Zwei Testabträge, beide mit einem 300-Watt-Laser. Was hier auf Probestücken zu sehen ist, wird vor jeder Partnerschaft am eigenen Rumpf wiederholt.",
 "s1.v1e":"Test 1 · Antifouling","s1.v1t":"GFK-Teil mit vier Schichten Antifouling",
 "s1.v1p":"Ein GFK-Bauteil mit vier übereinanderliegenden Antifouling-Schichten, orange über blau. Der Handkopf fährt in Bahnen darüber und nimmt Schicht für Schicht ab, bis das Substrat freiliegt. Kein Strahlmittel, keine Abdeckung, kein sichtbarer Staub.",
 "s1.v2e":"Test 2 · Lack auf Gelcoat","s1.v2t":"Rote Lackschicht auf Gelcoat",
 "s1.v2p":"Hier wird eine rote Lackschicht von einem GFK-Teil abgetragen — und zwar bis auf das Gelcoat, das unbeschädigt darunter zum Vorschein kommt. Das ist der heikelste Fall: die Abtragstiefe muss auf Bruchteile eines Millimeters stimmen.",
 "s1.massS":"Woher die Abfallmengen kommen — und was daran gerechnet ist",
 "s1.mass1":"<b>Die Abtragsmasse ist eine Massenbilanz, keine Messung.</b> 33 m² bei 0,6–1,5 mm Altaufbau und einer Trockenfilmdichte um 1,5 g/cm³ ergeben 30–75 kg abgetragenes Material. Das gilt für jedes Verfahren gleich — Masse verschwindet nicht.",
 "s1.mass2":"<b>Der Unterschied liegt darin, was daraus wird.</b> Beim Schleifen bleibt die volle Masse als Staub, plus Schleifmittelabrieb. Beim Abbeizen kommt das Abbeizmittel dazu, und der Abfall ist flüssig bis pastös — die teuerste Entsorgungsklasse. Beim Laser pyrolysiert der organische Bindemittelanteil; die anorganischen Pigmente, vor allem Kupferoxid, bleiben als Feststoff im Filter.",
 "s1.mass3":"<b>Was offen ist:</b> Publizierte Emissionsmessungen für Laserabtrag von Biozidbeschichtungen gibt es nicht. Wer damit arbeitet, braucht eine eigene Messung für die Gefährdungsbeurteilung. Auch die 6–11 Stunden sind eine Ableitung, keine normierte Vergleichsmessung — der Testabtrag am Referenzboot validiert beides.",
 "s1.sysE":"Das Lasersystem","s1.sysT":"Boatsdoc BD-1000",
 "s1.spec1":"Quelle","s1.spec1v":"1000 W gepulster Faserlaser, MOPA, JPT",
 "s1.spec2":"Arbeitsbreite","s1.spec2v":"290 mm Feldoptik, wechselbar auf 175 mm für Kiel und Ruder",
 "s1.spec3":"Absaugung","s1.spec3v":"HEPA- und Aktivkohlestufe direkt am Handkopf",
 "s1.spec4":"Faserlänge","s1.spec4v":"10 m, wahlweise 20 m",
 "s1.spec5":"Sicherheit","s1.spec5v":"Laserklasse 4, Schutzkonzept nach EN 60825-1 im Paket",
 "s1.sysNote":"Einstiegsvariante <b>BD-500</b> mit 500 W und 175 mm Arbeitsbreite: rund halbe Flächenleistung, luftgekühlt, leichter zu transportieren. Die Testvideos unter „Verfahren“ entstanden mit einem 300-W-Kopf.",
 "s1.matE":"Der Materialpartner","s1.matT":"NautiCare, Krefeld",
 "s1.mat1":"Das neue Antifouling und der komplette Beschichtungsaufbau kommen von <a href=\"https://nauticare.de/\" target=\"_blank\" rel=\"noopener\">NautiCare</a> — Generalimporteur von De IJssel Coatings für Deutschland, Österreich und die Schweiz, dazu Hempel-Antifouling und die eigenen Linien NautiPol und NautiPox.",
 "s1.mat2":"Für Sie heißt das: ein Systemaufbau statt zusammengesuchter Produkte, feste Konditionen über den Rahmenvertrag, und ein Ansprechpartner für die Gewährleistung, wenn Untergrund und Beschichtung aus einer Hand kommen.",

 "s5.cL":"Der Länderpartner ist kein Wiederverkäufer. Er baut in seinem Land das Netz auf: Er gewinnt Marinas und Werften als Partner, die selbst mit dem Laser arbeiten, und Bootsshops und Vereine als Servicepartner, die vermitteln. Für jeden Auftrag, der irgendwo in seinem Land über die Plattform läuft, bekommt er einen Anteil — dauerhaft, auch Jahre später und auch aus Betrieben, die er einmal gewonnen hat.",

 "s5.iscE":"Wer hinter Boatsdoc steht",
 "s5.isc1":"Dreißig Jahre Strahltechnik und Oberflächenreinigung, Sitz in Zossen bei Berlin. Trockeneis, Sand, Soda, Sponge-Jet und Laser — alle Verfahren im eigenen Haus, ISO 9001 zertifiziert, Mitglied im Verband Trockeneisstrahlen Deutschland.",
 "s5.isc2":"Boatsdoc ist keine Gründung auf dem Papier. Verfahrenskompetenz, Maschinen und Betriebshandbuch kommen aus einem Betrieb, der seit drei Jahrzehnten nichts anderes macht — <a href=\"https://www.reinigung-mit-trockeneis.de/\" target=\"_blank\" rel=\"noopener\">reinigung-mit-trockeneis.de</a>.",

 "s5.regNO":"Norwegen","s5.regNOv":"Oslofjord-Forskrift, vorgeschriebene Spülplatten mit Auffanganlage. Marinas haften für den Abtrag auf ihrem Gelände.",
 "s5.regDE":"Deutschland","s5.regDEv":"Flächenauflage aus der Biozidzulassung, Immissionsrecht je Bundesland unterschiedlich.",
 "s5.regX":"Absehbar","s5.regXv":"Der Arbeitsplatzgrenzwert für Kupfer steht zur Neubewertung. Fällt er wie vorgeschlagen, ist trockenes Schleifen ohne geschlossene Absaugung praktisch nicht mehr zulässig.",

 "s5.copy":"Adresse kopieren","s5.copied":"Kopiert","s5.marked":"Markiert — jetzt kopieren",

 "s1.mass1":"<b>The removed mass is a mass balance, not a measurement.</b> 33 m² at 0.6–1.5 mm of old build-up and a dry-film density around 1.5 g/cm³ gives 30–75 kg of removed material. That holds for every method alike — mass does not disappear.",
 "s1.mass2":"<b>The difference is what becomes of it.</b> Sanding leaves the full mass as dust, plus abrasive debris. Stripping adds the stripper itself, and the waste is liquid to paste — the most expensive disposal class. With the laser the organic binder pyrolyses; the inorganic pigments, above all copper oxide, remain as solids in the filter.",

 "s5.cFoot":"Conservative: only the running fee from the partner network, without your own jobs and without your share of the system access fees of the partners you win. Both come on top.",
 "s5.iscE":"Who stands behind Boatsdoc",
 "s5.isc1":"Thirty years of blasting technology and surface cleaning, based in Zossen near Berlin. Dry ice, sand, soda, sponge-jet and laser — every method in house, ISO 9001 certified, member of the German Dry Ice Blasting Association.",
 "s5.isc2":"Boatsdoc is not a start-up on paper. The process expertise, the machines and the operating manual come from a business that has done nothing else for three decades — <a href=\"https://www.reinigung-mit-trockeneis.de/\" target=\"_blank\" rel=\"noopener\">reinigung-mit-trockeneis.de</a>.",
 "s5.regE":"Regulatory pressure across Europe",
 "s5.regEU":"EU-wide","s5.regEUv":"Biocide authorisation condition: whoever removes antifouling has to contain the removed material. Open-air sanding is finished.",
 "s5.regSE":"Sweden","s5.regSEv":"Mandatory remediation of old coatings with an XRF measurement record. The strongest obligation in Europe.",

 "s1.massS":"Varifrån avfallsmängderna kommer — och vad som är beräknat",

 "s1.mass2":"<b>Skillnaden ligger i vad det blir av den.</b> Vid slipning blir hela massan damm, plus slipmedelsrester. Vid kemisk borttagning tillkommer medlet självt, och avfallet är flytande till pastöst — den dyraste avfallsklassen. Med lasern pyrolyseras det organiska bindemedlet; de oorganiska pigmenten, framför allt kopparoxid, stannar som fast material i filtret.",

T.de["s1.v2t"]="Weißer Lackstreifen auf rotem Gelcoat";
T.de["s1.v2p"]="Auf rotem Gelcoat liegt ein weißer Lackstreifen. Der Laser nimmt den Lack ab, das Gelcoat darunter bleibt unversehrt. Das ist der heikelste Fall überhaupt: Die Abtragstiefe muss auf Bruchteile eines Millimeters stimmen, sonst ist der Rumpf beschädigt.";
T.de["s0.pE"]="Die beiden Partner dahinter";
T.de["s0.p1n"]="ISC Industrie-Service-Czech GmbH";
T.de["s0.p1a"]="Seit über 30 Jahren · Zossen bei Berlin";
T.de["s0.p1t"]="Strahltechnik in allen Verfahren — Trockeneis, Sand, Soda, Sponge-Jet, Laser. Und zwar nicht nur angewendet: Über die Jahre auch verkauft und vermietet. Deshalb wissen wir, welches Verfahren wann trägt und welches Gerät den Dauerbetrieb aushält, weil wir beide Seiten kennen. ISO 9001 zertifiziert, Mitglied im Verband Trockeneisstrahlen Deutschland.";
T.de["s0.p2n"]="NautiCare GmbH & Co. KG";
T.de["s0.p2a"]="Seit 2010 · Teil der De IJssel Coatings Gruppe";
T.de["s0.p2t"]="Generalimporteur von De IJssel Coatings für Deutschland, Österreich und die Schweiz. Dahinter steht ein Farbhersteller aus Moordrecht bei Rotterdam, der <b>seit 1930</b> Bootslacke entwickelt — fast hundert Jahre Rezepturwissen. Was auf den Rumpf kommt, stammt aus einer eigenen Entwicklungsabteilung, nicht aus einem Handelskatalog.";
T.de["s0.pWhyT"]="Der eine weiß, wie die alte Schicht runterkommt. Der andere, was danach draufgehört.";
T.de["s0.pWhy"]="Genau deshalb sind das die beiden Hauptpartner. Beides aus einer Hand ist der Grund, warum wir Gewährleistung auf das Ergebnis geben können und nicht nur auf die Arbeitsstunden — bei getrennten Zuständigkeiten zeigt im Schadensfall jeder auf den anderen.";

T.en["s1.v2t"]="White paint stripe on red gelcoat";
T.en["s1.v2p"]="A white paint stripe sits on red gelcoat. The laser takes the paint off and the gelcoat underneath stays untouched. This is the hardest case of all: removal depth has to be right to a fraction of a millimetre, or the hull is damaged.";
T.en["s0.pE"]="The two partners behind it";
T.en["s0.p1n"]="ISC Industrie-Service-Czech GmbH";
T.en["s0.p1a"]="Over 30 years · Zossen near Berlin";
T.en["s0.p1t"]="Blasting technology across every method — dry ice, sand, soda, sponge-jet, laser. And not only applied: sold and rented out over the years as well. That is why we know which method holds up when, and which machine survives continuous use, because we know both sides of it. ISO 9001 certified, member of the German Dry Ice Blasting Association.";
T.en["s0.p2n"]="NautiCare GmbH & Co. KG";
T.en["s0.p2a"]="Since 2010 · part of the De IJssel Coatings group";
T.en["s0.p2t"]="General importer of De IJssel Coatings for Germany, Austria and Switzerland. Behind it stands a paint manufacturer in Moordrecht near Rotterdam that has been developing marine coatings <b>since 1930</b> — almost a century of formulation knowledge. What goes onto the hull comes from its own development department, not from a trade catalogue.";
T.en["s0.pWhyT"]="One knows how the old layer comes off. The other knows what belongs on afterwards.";
T.en["s0.pWhy"]="That is exactly why these are the two main partners. Both from one source is the reason we can warrant the result and not just the hours — where responsibilities are split, each side points at the other when something goes wrong.";

T.sv["s1.v2t"]="Vit lackrand på röd gelcoat";
T.sv["s1.v2p"]="På röd gelcoat ligger en vit lackrand. Lasern tar bort lacken, gelcoaten under förblir orörd. Det är det allra svåraste fallet: avverkningsdjupet måste stämma på bråkdelar av en millimeter, annars skadas skrovet.";
T.sv["s0.pE"]="De två partnerna bakom";
T.sv["s0.p1n"]="ISC Industrie-Service-Czech GmbH";
T.sv["s0.p1a"]="I över 30 år · Zossen utanför Berlin";
T.sv["s0.p1t"]="Blästerteknik i alla metoder — torris, sand, soda, sponge-jet, laser. Och inte bara använd: även såld och uthyrd genom åren. Därför vet vi vilken metod som håller när, och vilken maskin som klarar kontinuerlig drift, eftersom vi känner båda sidor. ISO 9001-certifierat, medlem i tyska torrisblästerförbundet.";
T.sv["s0.p2n"]="NautiCare GmbH & Co. KG";
T.sv["s0.p2a"]="Sedan 2010 · del av De IJssel Coatings-gruppen";
T.sv["s0.p2t"]="Generalimportör för De IJssel Coatings i Tyskland, Österrike och Schweiz. Bakom står en färgtillverkare i Moordrecht utanför Rotterdam som utvecklat båtlacker <b>sedan 1930</b> — nästan hundra år av receptkunnande. Det som hamnar på skrovet kommer från en egen utvecklingsavdelning, inte ur en handelskatalog.";
T.sv["s0.pWhyT"]="Den ene vet hur det gamla skiktet går av. Den andre vad som ska på efteråt.";
T.sv["s0.pWhy"]="Just därför är det dessa två huvudpartner. Båda från samma håll är skälet till att vi kan lämna garanti på resultatet och inte bara på arbetstimmarna — med delat ansvar pekar var och en på den andre när något går fel.";

T.no["s1.v2t"]="Hvit lakkstripe på rød gelcoat";
T.no["s1.v2p"]="På rød gelcoat ligger en hvit lakkstripe. Laseren tar av lakken, gelcoaten under forblir urørt. Det er det aller vanskeligste tilfellet: avvirkningsdybden må stemme på brøkdeler av en millimeter, ellers skades skroget.";
T.no["s0.pE"]="De to partnerne bak";
T.no["s0.p1n"]="ISC Industrie-Service-Czech GmbH";
T.no["s0.p1a"]="I over 30 år · Zossen utenfor Berlin";
T.no["s0.p1t"]="Blåseteknikk i alle metoder — tørris, sand, soda, sponge-jet, laser. Og ikke bare brukt: også solgt og leid ut gjennom årene. Derfor vet vi hvilken metode som holder når, og hvilken maskin som tåler kontinuerlig drift, fordi vi kjenner begge sider. ISO 9001-sertifisert, medlem i det tyske tørrisblåseforbundet.";
T.no["s0.p2n"]="NautiCare GmbH & Co. KG";
T.no["s0.p2a"]="Siden 2010 · del av De IJssel Coatings-gruppen";
T.no["s0.p2t"]="Generalimportør for De IJssel Coatings i Tyskland, Østerrike og Sveits. Bak står en malingsprodusent i Moordrecht utenfor Rotterdam som har utviklet båtlakk <b>siden 1930</b> — nesten hundre år med resepturkunnskap. Det som havner på skroget kommer fra en egen utviklingsavdeling, ikke fra en handelskatalog.";
T.no["s0.pWhyT"]="Den ene vet hvordan det gamle laget går av. Den andre hva som skal på etterpå.";
T.no["s0.pWhy"]="Nettopp derfor er dette de to hovedpartnerne. Begge fra samme hold er grunnen til at vi kan gi garanti på resultatet og ikke bare på arbeidstimene — med delt ansvar peker hver på den andre når noe går galt.";

T.da["s1.v2t"]="Hvid lakstribe på rød gelcoat";
T.da["s1.v2p"]="På rød gelcoat ligger en hvid lakstribe. Laseren tager lakken af, gelcoaten under forbliver urørt. Det er det allersværeste tilfælde: afrensningsdybden skal passe på brøkdele af en millimeter, ellers beskadiges skroget.";
T.da["s0.pE"]="De to partnere bag";
T.da["s0.p1n"]="ISC Industrie-Service-Czech GmbH";
T.da["s0.p1a"]="I over 30 år · Zossen ved Berlin";
T.da["s0.p1t"]="Blæseteknik i alle metoder — tøris, sand, soda, sponge-jet, laser. Og ikke kun anvendt: også solgt og udlejet gennem årene. Derfor ved vi, hvilken metode der holder hvornår, og hvilken maskine der klarer kontinuerlig drift, fordi vi kender begge sider. ISO 9001-certificeret, medlem af det tyske tørisblæseforbund.";
T.da["s0.p2n"]="NautiCare GmbH & Co. KG";
T.da["s0.p2a"]="Siden 2010 · del af De IJssel Coatings-gruppen";
T.da["s0.p2t"]="Generalimportør for De IJssel Coatings i Tyskland, Østrig og Schweiz. Bag står en malingsproducent i Moordrecht ved Rotterdam, der har udviklet bådlakker <b>siden 1930</b> — næsten hundrede år med receptviden. Det, der kommer på skroget, stammer fra en egen udviklingsafdeling, ikke fra et handelskatalog.";
T.da["s0.pWhyT"]="Den ene ved, hvordan det gamle lag kommer af. Den anden hvad der skal på bagefter.";
T.da["s0.pWhy"]="Netop derfor er det de to hovedpartnere. Begge fra samme sted er grunden til, at vi kan give garanti på resultatet og ikke kun på arbejdstimerne — med delt ansvar peger hver på den anden, når noget går galt.";

T.fi["s1.v2t"]="Valkoinen maaliraita punaisen gelcoatin päällä";
T.fi["s1.v2p"]="Punaisen gelcoatin päällä on valkoinen maaliraita. Laser ottaa maalin pois, ja alla oleva gelcoat säilyy koskemattomana. Tämä on kaikkein vaikein tapaus: poistosyvyyden on oltava oikea millimetrin murto-osan tarkkuudella, muuten runko vaurioituu.";
T.fi["s0.pE"]="Kaksi kumppania taustalla";
T.fi["s0.p1n"]="ISC Industrie-Service-Czech GmbH";
T.fi["s0.p1a"]="Yli 30 vuotta · Zossen Berliinin lähellä";
T.fi["s0.p1t"]="Puhallustekniikkaa kaikilla menetelmillä — kuivajää, hiekka, sooda, sponge-jet, laser. Eikä vain käytettynä: myös myytynä ja vuokrattuna vuosien varrella. Siksi tiedämme, mikä menetelmä kestää missäkin ja mikä laite kestää jatkuvan käytön, koska tunnemme molemmat puolet. ISO 9001 -sertifioitu, Saksan kuivajääpuhallusliiton jäsen.";
T.fi["s0.p2n"]="NautiCare GmbH & Co. KG";
T.fi["s0.p2a"]="Vuodesta 2010 · osa De IJssel Coatings -ryhmää";
T.fi["s0.p2t"]="De IJssel Coatingsin maahantuoja Saksassa, Itävallassa ja Sveitsissä. Taustalla on maalinvalmistaja Moordrechtissa Rotterdamin lähellä, joka on kehittänyt venemaaleja <b>vuodesta 1930</b> — lähes sata vuotta reseptiosaamista. Se mikä runkoon tulee, on peräisin omasta tuotekehityksestä, ei kauppaluettelosta.";
T.fi["s0.pWhyT"]="Toinen tietää, miten vanha kerros lähtee. Toinen sen, mitä päälle kuuluu.";
T.fi["s0.pWhy"]="Juuri siksi nämä ovat kaksi pääkumppania. Molemmat samasta paikasta on syy siihen, että voimme antaa takuun lopputuloksesta emmekä vain työtunneista — jaetulla vastuulla kumpikin osoittaa toista, kun jokin menee pieleen.";

T.de["s1.c3a"]="13 Std mit BD-1000 · 33 Std mit BD-500, eine Person";
T.de["s1.mass3"]="<b>Was offen ist:</b> Publizierte Emissionsmessungen für Laserabtrag von Biozidbeschichtungen gibt es nicht. Wer damit arbeitet, braucht eine eigene Messung für die Gefährdungsbeurteilung. Die Laserzeiten sind bewusst konservativ angesetzt — 80 % (BD-1000) bzw. 50 % (BD-500) weniger als die 65 Stunden beim Schleifen — und keine normierte Vergleichsmessung. Der Testabtrag am Referenzboot validiert beides.";

T.de["s5.foot"]="Zeitwerte und Materialverbräuche für Abbeizen und Schleifen aus einem dokumentierten Praxisbericht an 33,5 m² Rumpffläche; Werftpreise von drei norddeutschen Betrieben für 30–33 m². Laserzeiten sind konservative Ansätze (−80 % BD-1000, −50 % BD-500 gegenüber Schleifen), der Filterrückstand eine Ableitung aus der Massenbilanz — keine normierten Messungen, der Testabtrag validiert beides. Alle Partnerbeträge, Schulungspreise, Provisionssätze und Leasingfaktoren sind Vorschläge; verbindliche Leasingkonditionen kommen von GRENKE. Keine Rechts-, Steuer- oder Finanzberatung.";
T.en["s1.c3a"]="13 hrs with BD-1000 · 33 hrs with BD-500, one person";
T.en["s1.mass3"]="<b>What is still open:</b> There are no published emission measurements for laser removal of biocidal coatings. Anyone working with it needs their own measurement for the risk assessment. Laser times are deliberately conservative — 80% (BD-1000) and 50% (BD-500) less than the 65 hours of sanding — and not a standardised comparison. The test removal on the reference boat validates both.";

T.en["s4.ass1"]="Full-cost model for the reference job 10 m, 33 m², 50 km radius: labour at €45/h, coating material from NautiCare, vehicle, extraction, depreciation, disposal, crane. With sanding, removal alone would take 65 hours; the BD-1000 cuts that by 80% to 13 hours, the BD-500 by 50% to 33 hours. Tent and blasting media drop out with both.";

T.en["s5.foot"]="Times and material consumption for stripping and sanding from a documented field report on 33.5 m² of hull; yard prices from three northern German businesses for 30–33 m². Laser times are conservative assumptions (−80% BD-1000, −50% BD-500 vs. sanding), filter residue is derived from mass balance — not standardised measurements; the test removal validates both. All partner amounts, training prices, fee rates and lease factors are proposals; binding lease terms come from GRENKE. Not legal, tax or financial advice.";

T.de["s1.vh"]="Gepulster Laser statt Schleifen und Abbeizen";
T.de["s1.b1"]="<b>80 % weniger Arbeitszeit:</b> rund 13 Stunden mit der BD-1000 (33 mit der BD-500) statt 65 Stunden Schleifen für 33 m².";
T.de["s1.b2"]="<b>Kein Verbrauchsmaterial:</b> keine Schleifscheiben, kein Abbeizer, kein Strahlmittel – nur Strom.";
T.de["s1.b3"]="<b>Kein Staub, kein Zelt – nur ein abgesperrter Laserbereich:</b> Die Absaugung sitzt am Kopf, der Bereich wird abgegrenzt und gekennzeichnet, mobile Schutzwände schirmen ab. Nachbarplätze bleiben nutzbar.";
T.de["s1.b4"]="<b>Das Gelcoat bleibt heil:</b> Abtrag Schicht für Schicht, die Tiefe wird über Pulsenergie und Vorschub geregelt.";
T.de["s1.b5"]="<b>Weniger Sondermüll, ganzjährig:</b> 15–50 kg Filterrückstand statt bis zu 120 kg Abbeizpaste – unabhängig von der Temperatur.";

T.de["faq.e"]="Häufige Fragen";
T.de["faq.h"]="Was Partner vor dem Start wissen wollen";
T.de["faq.l"]="Betrieb, Auflagen, Schulung, Garantie und Lieferung – kurz beantwortet. <b>Pflicht</b> heißt gesetzlich vorgeschrieben, <b>Empfohlen</b> heißt gute Praxis.";
T.de["faq.jump"]="Häufige Fragen: Strom, Auflagen, Schulung, Garantie, Zoll →";
T.de["faq.q1"]="Was kostet der Strom pro Quadratmeter?";
T.de["faq.a1"]="Sehr wenig. Der BD-500 nimmt höchstens 3 kW auf und braucht rund 3 kWh pro m². Der BD-1000 nimmt rund 6 kW auf, ist aber schneller fertig und braucht etwa 2,4 kWh pro m². Mit Gewerbestrompreisen (Eurostat, 2. Halbjahr 2025) ergibt das: <b>Deutschland, Österreich, Schweiz 0,60–1,00 € pro m²</b>, Schweden und Dänemark 0,30–0,60 €, Norwegen und Finnland 0,20–0,30 €. Ein Unterwasserschiff mit 33 m² kostet damit 8–32 € Strom.";
T.de["faq.q2"]="Welchen Stromanschluss brauche ich?";
T.de["faq.a2"]="<b>BD-500:</b> 230 V, max. 3 kW – eine 16-A-Steckdose an einem eigenen Stromkreis reicht. Die Absaugung kommt an einen zweiten Kreis, sonst löst die Sicherung aus. <b>BD-1000:</b> bis 6 kW (rund 27 A), wassergekühlt – das braucht einen CEE-Anschluss mit 32 A und eigener Absicherung; an einer normalen Steckdose läuft sie nicht. Klären Sie vor der Bestellung, ob Ihr Serviceplatz oder Ihre Halle diesen Anschluss hat.";
T.de["faq.q3"]="Welche Umweltauflagen gelten beim Abtragen?";
T.de["faq.a3"]="<b>Pflicht:</b> Abgetragenes Antifouling darf nicht in Boden oder Wasser gelangen. Gearbeitet wird in einem abgegrenzten Bereich auf undurchlässigem Untergrund oder einer Plane. Farbreste, Stäube und Filter sind gefährlicher Abfall und gehen mit Nachweis an einen zugelassenen Entsorger. Die Platz- oder Hafenordnung gilt zusätzlich und ist oft strenger als das Gesetz. <b>Empfohlen:</b> Auffangwanne oder Plane mit Rand, Entsorgungsvertrag vor dem ersten Auftrag, kurze Abstimmung mit der Umweltbehörde der Gemeinde – in Schweden und Dänemark üblich.";
T.de["faq.q4"]="Ist eine Absaugung vorgeschrieben?";
T.de["faq.a4"]="Beim Abtrag entstehen Rauch und Feinstaub mit Kupfer und Zink, bei alten Anstrichen auch Blei oder TBT. Das Gesetz schreibt kein bestimmtes Gerät vor. <b>Pflicht</b> ist aber, die Belastung unter den Grenzwerten zu halten, und technische Maßnahmen gehen dabei vor Atemmasken. In der Praxis heißt das: <b>Ohne Absaugung direkt am Laserkopf geht es nicht.</b> <b>Empfohlen:</b> Absaugung Staubklasse H (HEPA H13/H14) mit Aktivkohlestufe, dazu Atemschutz P3/FFP3 und Schutzanzug.";
T.de["faq.q5"]="Was gilt für die Lasersicherheit?";
T.de["faq.a5"]="Beide Geräte sind Laser der Klasse 4. <b>Pflicht in allen Ländern:</b> Gefährdungsbeurteilung, abgegrenzter und gekennzeichneter Laserbereich, Laserschutzbrille nach EN 207 für alle im Bereich, Zutritt nur für unterwiesene Personen. <b>Je nach Land:</b> Deutschland verlangt einen schriftlich bestellten Laserschutzbeauftragten. In Norwegen wird jeder Klasse-4-Laser bei der Strahlenschutzbehörde DSA gemeldet (über Altinn). In Schweden braucht der handgeführte Einsatz an allgemein zugänglichen Orten eine Genehmigung der SSM – ob Ihr Gelände darunter fällt, klären wir vor dem Start. <b>Empfohlen:</b> mobile Laserschutzwände nach EN 60825-4.";
T.de["faq.q6"]="Müssen Mitarbeiter geschult werden – und von wem?";
T.de["faq.a6"]="<b>Pflicht:</b> Jeder Bediener wird vor dem ersten Einsatz und danach jährlich unterwiesen, zu Laser und zu Gefahrstoffen. Das macht der Betrieb selbst, eine staatliche Prüfstelle ist nicht nötig. In Deutschland braucht der Betrieb zusätzlich mindestens einen <b>Laserschutzbeauftragten</b> mit Lehrgang und Prüfung nach DGUV-Grundsatz 303-005: zwei Tage, üblich 800–1.250 €, Auffrischung alle fünf Jahre. Den Lehrgang darf jeder geeignete Anbieter durchführen, eine behördliche Zulassung gibt es nicht. In der Schweiz wird eine Laserschutz-Person benannt, in Österreich oft per Bescheid verlangt. In Skandinavien genügt die Unterweisung. <b>Bei uns:</b> Geräteeinweisung, fertige Unterweisungsunterlagen und der Lehrgang zum Laserschutzbeauftragten mit einem Bildungspartner.";
T.de["faq.q7"]="Welche Garantie gibt der Hersteller?";
T.de["faq.a7"]="<b>2 Jahre auf das komplette Gerät.</b> Geht in dieser Zeit ein Teil kaputt, repariert oder ersetzt der Hersteller es kostenlos. Ausgenommen sind Verschleißteile, vor allem Schutzgläser, sowie Schäden durch Bedienfehler oder höhere Gewalt. Die Laserquelle stammt von JPT. Zum Lieferumfang gehören 20 Schutzgläser und eine Laserschutzbrille, dazu Handbuch, Schulungsvideos und Fernsupport rund um die Uhr.";
T.de["faq.q8"]="Wie schnell kommen Gerät und Ersatzteile?";
T.de["faq.a8"]="Der Hersteller fertigt in 7–9 Arbeitstagen nach Anzahlung, per Luftfracht ist das Gerät nach weiteren 18–20 Tagen da. <b>Rechnen Sie mit 4–5 Wochen ab Bestellung.</b> Ersatzteile kommen per Express in etwa einer Woche. Schutzgläser sind das einzige regelmäßige Verschleißteil – halten Sie immer einen Vorrat.";
T.de["faq.q9"]="Kommen Zoll und Transport dazu?";
T.de["faq.a9"]="Die Geräte kommen per Luftfracht <b>verzollt</b> nach Deutschland. Innerhalb der EU – auch nach Österreich, Schweden, Dänemark und Finnland – fällt danach kein weiterer Zoll an. Nach Norwegen und in die Schweiz kommt eine Einfuhrabfertigung hinzu: Zoll 0 %, Einfuhr-Mehrwertsteuer 25 % bzw. 8,1 %, die Sie als Vorsteuer zurückbekommen. Die Transportkosten bis zu Ihrem Standort stehen im Angebot.";
T.de["faq.note"]="Stand Oktober 2026. Allgemeine Information, keine Rechtsberatung. Die Regeln für Ihren Standort stimmen wir vor dem Start mit Ihnen und dem Platzbetreiber ab.";

T.en["s1.b1"]="<b>up to 80% less working time:</b> about 13 hours with the BD-1000 (33 with the BD-500) instead of 65 hours of sanding for 33 m².";

T.en["s1.b4"]="<b>The gelcoat stays intact:</b> removal layer by layer, depth controlled through pulse energy and feed rate.";
T.en["s1.b5"]="<b>Less hazardous waste, all year:</b> 15–50 kg of filter residue instead of up to 120 kg of stripping paste – regardless of temperature.";

T.en["faq.h"]="What partners want to know before they start";
T.en["faq.l"]="Operation, rules, training, warranty and delivery – answered briefly. <b>Mandatory</b> means required by law, <b>Recommended</b> means good practice.";
T.en["faq.jump"]="FAQ: electricity, rules, training, warranty, customs →";
T.en["faq.q1"]="What does the electricity cost per square metre?";
T.en["faq.a1"]="Very little. The BD-500 draws at most 3 kW and needs about 3 kWh per m². The BD-1000 draws about 6 kW but finishes faster and needs about 2.4 kWh per m². At business electricity prices (Eurostat, H2 2025) that comes to: <b>Germany, Austria, Switzerland €0.60–1.00 per m²</b>, Sweden and Denmark €0.30–0.60, Norway and Finland €0.20–0.30. A 33 m² underwater hull costs €8–32 in electricity.";
T.en["faq.q2"]="What power supply do I need?";
T.en["faq.a2"]="<b>BD-500:</b> 230 V, max. 3 kW – a 16 A socket on its own circuit is enough. Put the extraction on a second circuit, or the breaker will trip. <b>BD-1000:</b> up to 6 kW (about 27 A), water-cooled – it needs a 32 A CEE connection with its own breaker and will not run on a normal socket. Check before ordering whether your service area or hall has this connection.";
T.en["faq.q3"]="Which environmental rules apply to removal?";
T.en["faq.a3"]="<b>Mandatory:</b> removed antifouling must not reach soil or water. Work takes place in a defined area on an impermeable surface or a tarpaulin. Paint residue, dust and filters are hazardous waste and go to a licensed waste company with documentation. The yard or harbour rules apply on top and are often stricter than the law. <b>Recommended:</b> a collection tray or edged tarpaulin, a disposal contract before the first job, and a short check with the municipal environmental office – common in Sweden and Denmark.";
T.en["faq.q4"]="Is extraction required?";
T.en["faq.a4"]="Removal produces fumes and fine dust containing copper and zinc, and with old coatings also lead or TBT. The law does not prescribe a specific device. It is <b>mandatory</b>, however, to keep exposure below the limit values, and technical measures take priority over respirators. In practice this means: <b>it does not work without extraction directly at the laser head.</b> <b>Recommended:</b> dust class H extraction (HEPA H13/H14) with an activated carbon stage, plus P3/FFP3 respiratory protection and a protective suit.";
T.en["faq.q5"]="What applies to laser safety?";
T.en["faq.a5"]="Both devices are class 4 lasers. <b>Mandatory in all countries:</b> a risk assessment, a marked and restricted laser area, laser safety goggles to EN 207 for everyone in the area, access only for instructed people. <b>By country:</b> Germany requires a laser safety officer appointed in writing. In Norway every class 4 laser is notified to the radiation authority DSA (via Altinn). In Sweden hand-held use in publicly accessible places needs an SSM permit – we clarify before the start whether your site counts as such. <b>Recommended:</b> mobile laser safety screens to EN 60825-4.";
T.en["faq.q6"]="Do staff need training – and from whom?";
T.en["faq.a6"]="<b>Mandatory:</b> every operator is instructed before first use and then every year, on the laser and on hazardous substances. The company does this itself; no state testing body is needed. In Germany the company also needs at least one <b>laser safety officer</b> with a course and exam under DGUV principle 303-005: two days, typically €800–1,250, refresher every five years. Any suitable provider may run the course; there is no official approval. In Switzerland a laser safety person is appointed, in Austria it is often required by permit. In Scandinavia instruction is sufficient. <b>With us:</b> device training, ready-made instruction documents and the laser safety officer course with an education partner.";
T.en["faq.q7"]="What warranty does the manufacturer give?";
T.en["faq.a7"]="<b>2 years on the complete device.</b> If a part fails during this time, the manufacturer repairs or replaces it free of charge. Excluded are wear parts, mainly protective windows, and damage from operating errors or force majeure. The laser source is made by JPT. Delivery includes 20 protective windows and laser safety goggles, plus a manual, training videos and 24/7 remote support.";
T.en["faq.q8"]="How fast do the device and spare parts arrive?";
T.en["faq.a8"]="The manufacturer builds the device in 7–9 working days after the deposit; by air freight it arrives 18–20 days later. <b>Plan on 4–5 weeks from order.</b> Spare parts arrive by express in about a week. Protective windows are the only regular wear part – always keep some in stock.";
T.en["faq.q9"]="Are customs and transport extra?";
T.en["faq.a9"]="The devices arrive in Germany by air freight, <b>customs cleared</b>. Within the EU – including Austria, Sweden, Denmark and Finland – no further duty applies. Norway and Switzerland add an import clearance: 0% duty, import VAT of 25% or 8.1%, which you reclaim as input tax. Transport costs to your site are shown in the offer.";
T.en["faq.note"]="As of October 2026. General information, not legal advice. We agree the rules for your site with you and the site operator before the start.";

T.sv["faq.e"]="Vanliga frågor";
T.sv["faq.h"]="Det partner vill veta före start";
T.sv["faq.l"]="Drift, krav, utbildning, garanti och leverans – kort besvarat. <b>Krav</b> betyder lagstadgat, <b>Rekommenderat</b> betyder god praxis.";
T.sv["faq.jump"]="Vanliga frågor: el, krav, utbildning, garanti, tull →";
T.sv["faq.q1"]="Vad kostar elen per kvadratmeter?";
T.sv["faq.a1"]="Mycket lite. BD-500 drar högst 3 kW och behöver cirka 3 kWh per m². BD-1000 drar cirka 6 kW men blir klar snabbare och behöver cirka 2,4 kWh per m². Med elpriser för företag (Eurostat, andra halvåret 2025) blir det: <b>Tyskland, Österrike, Schweiz 0,60–1,00 € per m²</b>, Sverige och Danmark 0,30–0,60 €, Norge och Finland 0,20–0,30 €. Ett undervattensskrov på 33 m² kostar alltså 8–32 € i el.";
T.sv["faq.q2"]="Vilken elanslutning behöver jag?";
T.sv["faq.a2"]="<b>BD-500:</b> 230 V, max. 3 kW – ett 16 A-uttag på egen krets räcker. Utsuget kopplas till en andra krets, annars löser säkringen ut. <b>BD-1000:</b> upp till 6 kW (cirka 27 A), vattenkyld – kräver en CEE-anslutning på 32 A med egen säkring och går inte på ett vanligt uttag. Kontrollera före beställning att er serviceplats eller hall har denna anslutning.";
T.sv["faq.q3"]="Vilka miljökrav gäller vid borttagning?";
T.sv["faq.a3"]="<b>Krav:</b> borttagen båtbottenfärg får inte hamna i mark eller vatten. Arbetet sker inom ett avgränsat område på tät yta eller presenning. Färgrester, damm och filter är farligt avfall och lämnas med dokumentation till en godkänd mottagare. Uppläggningsplatsens eller hamnens regler gäller dessutom och är ofta strängare än lagen. <b>Rekommenderat:</b> uppsamlingskar eller presenning med kant, avfallsavtal före första uppdraget och en kort avstämning med kommunens miljöförvaltning – vanligt i Sverige och Danmark.";
T.sv["faq.q4"]="Är utsug ett krav?";
T.sv["faq.a4"]="Vid borttagningen bildas rök och fint damm med koppar och zink, vid gamla färgskikt även bly eller TBT. Lagen föreskriver ingen viss utrustning. Det är dock ett <b>krav</b> att hålla exponeringen under gränsvärdena, och tekniska åtgärder går före andningsskydd. I praktiken betyder det: <b>utan utsug direkt vid laserhuvudet går det inte.</b> <b>Rekommenderat:</b> utsug i dammklass H (HEPA H13/H14) med aktivt kol, dessutom andningsskydd P3/FFP3 och skyddsdräkt.";
T.sv["faq.q5"]="Vad gäller för lasersäkerheten?";
T.sv["faq.a5"]="Båda maskinerna är lasrar i klass 4. <b>Krav i alla länder:</b> riskbedömning, avgränsat och märkt laserområde, laserskyddsglasögon enligt EN 207 för alla i området, tillträde endast för instruerade personer. <b>Beroende på land:</b> Tyskland kräver en skriftligt utsedd laserskyddsansvarig. I Norge anmäls varje klass 4-laser till strålskyddsmyndigheten DSA (via Altinn). I Sverige kräver handhållen användning på allmän plats tillstånd från SSM – om er plats räknas dit klargör vi före start. <b>Rekommenderat:</b> mobila laserskyddsväggar enligt EN 60825-4.";
T.sv["faq.q6"]="Måste personalen utbildas – och av vem?";
T.sv["faq.a6"]="<b>Krav:</b> varje operatör instrueras före första användningen och därefter varje år, om lasern och om farliga ämnen. Det gör företaget själv, något statligt provorgan behövs inte. I Tyskland behöver företaget dessutom minst en <b>laserskyddsansvarig</b> med kurs och prov enligt DGUV-princip 303-005: två dagar, vanligen 800–1 250 €, repetition vart femte år. Kursen får hållas av varje lämplig anordnare, något myndighetsgodkännande finns inte. I Schweiz utses en laserskyddsperson, i Österrike krävs det ofta i tillståndet. I Skandinavien räcker instruktionen. <b>Hos oss:</b> maskininstruktion, färdigt instruktionsmaterial och kursen till laserskyddsansvarig med en utbildningspartner.";
T.sv["faq.q7"]="Vilken garanti ger tillverkaren?";
T.sv["faq.a7"]="<b>2 år på hela maskinen.</b> Går en del sönder under den tiden reparerar eller ersätter tillverkaren den kostnadsfritt. Undantagna är slitdelar, främst skyddsglas, samt skador genom felhantering eller force majeure. Laserkällan kommer från JPT. I leveransen ingår 20 skyddsglas och ett par laserskyddsglasögon, dessutom manual, utbildningsvideor och fjärrsupport dygnet runt.";
T.sv["faq.q8"]="Hur snabbt kommer maskin och reservdelar?";
T.sv["faq.a8"]="Tillverkaren bygger maskinen på 7–9 arbetsdagar efter handpenning, med flygfrakt är den framme 18–20 dagar senare. <b>Räkna med 4–5 veckor från beställning.</b> Reservdelar kommer med express på ungefär en vecka. Skyddsglas är den enda regelbundna slitdelen – ha alltid ett lager.";
T.sv["faq.q9"]="Tillkommer tull och transport?";
T.sv["faq.a9"]="Maskinerna kommer med flygfrakt <b>förtullade</b> till Tyskland. Inom EU – även till Österrike, Sverige, Danmark och Finland – tillkommer ingen ytterligare tull. Till Norge och Schweiz tillkommer en importdeklaration: 0 % tull, importmoms 25 % resp. 8,1 %, som ni får tillbaka som ingående moms. Transportkostnaden till er plats står i offerten.";
T.sv["faq.note"]="Gäller oktober 2026. Allmän information, ingen juridisk rådgivning. Reglerna för er plats stämmer vi av med er och platsens ägare före start.";

T.no["faq.q1"]="Hva koster strømmen per kvadratmeter?";
T.no["faq.a1"]="Svært lite. BD-500 trekker maks 3 kW og bruker rundt 3 kWh per m². BD-1000 trekker rundt 6 kW, men blir raskere ferdig og bruker ca. 2,4 kWh per m². Med strømpriser for næringskunder (Eurostat, 2. halvår 2025) blir det: <b>Tyskland, Østerrike, Sveits 0,60–1,00 € per m²</b>, Sverige og Danmark 0,30–0,60 €, Norge og Finland 0,20–0,30 €. Et undervannsskrog på 33 m² koster dermed 8–32 € i strøm.";
T.no["faq.q2"]="Hvilken strømtilkobling trenger jeg?";
T.no["faq.a2"]="<b>BD-500:</b> 230 V, maks. 3 kW – en 16 A-kontakt på egen kurs holder. Avsuget kobles til en annen kurs, ellers løser sikringen ut. <b>BD-1000:</b> opptil 6 kW (rundt 27 A), vannkjølt – krever en CEE-tilkobling på 32 A med egen sikring og går ikke på en vanlig stikkontakt. Avklar før bestilling om serviceplassen eller hallen har denne tilkoblingen.";
T.no["faq.q3"]="Hvilke miljøkrav gjelder ved fjerning?";
T.no["faq.a3"]="<b>Påkrevd:</b> fjernet bunnstoff skal ikke havne i grunn eller vann. Arbeidet skjer i et avgrenset område på tett underlag eller presenning. Malingsrester, støv og filtre er farlig avfall og leveres med dokumentasjon til godkjent mottak. Havnens eller opplagsplassens regler gjelder i tillegg og er ofte strengere enn loven. <b>Anbefalt:</b> oppsamlingskar eller presenning med kant, avfallsavtale før første oppdrag og en kort avklaring med kommunens miljømyndighet – vanlig i Sverige og Danmark.";
T.no["faq.q4"]="Er avsug påkrevd?";
T.no["faq.a4"]="Ved fjerningen dannes røyk og fint støv med kobber og sink, ved gamle malingslag også bly eller TBT. Loven foreskriver ikke et bestemt apparat. Det er likevel <b>påkrevd</b> å holde eksponeringen under grenseverdiene, og tekniske tiltak går foran åndedrettsvern. I praksis betyr det: <b>uten avsug direkte ved laserhodet går det ikke.</b> <b>Anbefalt:</b> avsug i støvklasse H (HEPA H13/H14) med aktivt kull, i tillegg åndedrettsvern P3/FFP3 og verneklær.";
T.no["faq.q5"]="Hva gjelder for lasersikkerhet?";
T.no["faq.a5"]="Begge maskinene er lasere i klasse 4. <b>Påkrevd i alle land:</b> risikovurdering, avgrenset og merket laserområde, laservernebriller etter EN 207 for alle i området, adgang bare for personer som har fått opplæring. <b>Etter land:</b> Tyskland krever en skriftlig utnevnt laservernansvarlig. I Norge skal hver klasse 4-laser meldes til DSA (via Altinn). I Sverige krever håndholdt bruk på allment tilgjengelige steder tillatelse fra SSM – om deres område faller inn under dette, avklarer vi før start. <b>Anbefalt:</b> mobile laservernvegger etter EN 60825-4.";
T.no["faq.q6"]="Må de ansatte få opplæring – og av hvem?";
T.no["faq.a6"]="<b>Påkrevd:</b> hver operatør får opplæring før første bruk og deretter hvert år, om laseren og om farlige stoffer. Det gjør virksomheten selv, et statlig kontrollorgan trengs ikke. I Tyskland trenger virksomheten i tillegg minst én <b>laservernansvarlig</b> med kurs og eksamen etter DGUV-prinsipp 303-005: to dager, vanligvis 800–1 250 €, oppfriskning hvert femte år. Kurset kan holdes av enhver egnet tilbyder, det finnes ingen offentlig godkjenning. I Sveits utnevnes en laservernperson, i Østerrike kreves det ofte i tillatelsen. I Skandinavia holder opplæringen. <b>Hos oss:</b> maskinopplæring, ferdig opplæringsmateriell og kurset til laservernansvarlig med en utdanningspartner.";
T.no["faq.q7"]="Hvilken garanti gir produsenten?";
T.no["faq.a7"]="<b>2 år på hele maskinen.</b> Går en del i stykker i denne tiden, reparerer eller erstatter produsenten den kostnadsfritt. Unntatt er slitedeler, først og fremst beskyttelsesglass, samt skader fra feilbruk eller force majeure. Laserkilden er fra JPT. Leveransen inkluderer 20 beskyttelsesglass og et par laservernebriller, i tillegg håndbok, opplæringsvideoer og fjernsupport døgnet rundt.";
T.no["faq.q8"]="Hvor raskt kommer maskin og reservedeler?";
T.no["faq.a8"]="Produsenten bygger maskinen på 7–9 arbeidsdager etter forskudd, med flyfrakt er den fremme 18–20 dager senere. <b>Regn med 4–5 uker fra bestilling.</b> Reservedeler kommer med ekspress på omtrent en uke. Beskyttelsesglass er den eneste faste slitedelen – ha alltid et lager.";
T.no["faq.q9"]="Kommer toll og transport i tillegg?";
T.no["faq.a9"]="Maskinene kommer med flyfrakt <b>fortollet</b> til Tyskland. Innenfor EU – også til Østerrike, Sverige, Danmark og Finland – kommer ingen ytterligere toll. Til Norge og Sveits kommer en importfortolling i tillegg: 0 % toll, innførsels-mva 25 % hhv. 8,1 %, som dere får tilbake som inngående mva. Transportkostnaden til deres sted står i tilbudet.";
T.no["faq.note"]="Per oktober 2026. Generell informasjon, ikke juridisk rådgivning. Reglene for deres sted avklarer vi med dere og plasseieren før start.";

T.fi["sp2.p"]="Videolla sama pinta käsitellään neljällä laserteholla peräkkäin. Selvästi näkyy, että suuremmalla teholla pinta puhdistuu huomattavasti nopeammin – siksi BD-1000 toimii noin kaksi kertaa niin nopeasti kuin BD-500.";

T.fi["faq.e"]="Usein kysytyt kysymykset";
T.fi["faq.h"]="Mitä kumppanit haluavat tietää ennen aloitusta";
T.fi["faq.l"]="Käyttö, vaatimukset, koulutus, takuu ja toimitus – lyhyesti. <b>Pakollinen</b> tarkoittaa lakisääteistä, <b>Suositeltu</b> hyvää käytäntöä.";
T.fi["faq.jump"]="Usein kysytyt: sähkö, vaatimukset, koulutus, takuu, tulli →";
T.fi["faq.q1"]="Paljonko sähkö maksaa neliömetriä kohden?";
T.fi["faq.a1"]="Hyvin vähän. BD-500 ottaa enintään 3 kW ja kuluttaa noin 3 kWh neliömetrille. BD-1000 ottaa noin 6 kW, mutta valmistuu nopeammin ja kuluttaa noin 2,4 kWh neliömetrille. Yritysten sähkönhinnoilla (Eurostat, 2. puolivuosi 2025) se tekee: <b>Saksa, Itävalta, Sveitsi 0,60–1,00 € / m²</b>, Ruotsi ja Tanska 0,30–0,60 €, Norja ja Suomi 0,20–0,30 €. 33 m²:n vedenalainen pohja maksaa siis 8–32 € sähköä.";
T.fi["faq.q2"]="Millaisen sähköliitännän tarvitsen?";
T.fi["faq.a2"]="<b>BD-500:</b> 230 V, enint. 3 kW – 16 A:n pistorasia omassa ryhmässä riittää. Imu kytketään toiseen ryhmään, muuten sulake laukeaa. <b>BD-1000:</b> enint. 6 kW (noin 27 A), vesijäähdytteinen – tarvitsee 32 A:n CEE-liitännän omalla sulakkeella eikä toimi tavallisessa pistorasiassa. Tarkista ennen tilausta, onko huoltopaikallanne tai hallissanne tämä liitäntä.";
T.fi["faq.q3"]="Mitkä ympäristövaatimukset koskevat poistoa?";
T.fi["faq.a3"]="<b>Pakollinen:</b> poistettu myrkkymaali ei saa päätyä maahan tai veteen. Työ tehdään rajatulla alueella tiiviillä alustalla tai peitteellä. Maalijäämät, pöly ja suodattimet ovat vaarallista jätettä ja toimitetaan dokumentoidusti luvanvaraiselle vastaanottajalle. Telakan tai sataman säännöt ovat lisäksi voimassa ja usein lakia tiukempia. <b>Suositeltu:</b> keräysallas tai reunallinen peite, jätesopimus ennen ensimmäistä työtä ja lyhyt tarkistus kunnan ympäristöviranomaisen kanssa – tavallista Ruotsissa ja Tanskassa.";
T.fi["faq.q4"]="Onko kohdepoisto pakollinen?";
T.fi["faq.a4"]="Poistossa syntyy savua ja hienopölyä, jossa on kuparia ja sinkkiä, vanhoissa maalikerroksissa myös lyijyä tai TBT:tä. Laki ei määrää tiettyä laitetta. On kuitenkin <b>pakollista</b> pitää altistus raja-arvojen alla, ja tekniset toimet menevät hengityssuojainten edelle. Käytännössä tämä tarkoittaa: <b>ilman kohdepoistoa suoraan laserpäässä se ei onnistu.</b> <b>Suositeltu:</b> pölyluokan H kohdepoisto (HEPA H13/H14) aktiivihiilivaiheella, lisäksi P3/FFP3-hengityssuojain ja suojapuku.";
T.fi["faq.q5"]="Mitä lasersäteilyturvallisuudesta on säädetty?";
T.fi["faq.a5"]="Molemmat laitteet ovat luokan 4 lasereita. <b>Pakollinen kaikissa maissa:</b> riskinarviointi, rajattu ja merkitty laseralue, EN 207 -mukaiset lasersuojalasit kaikille alueella olijoille, pääsy vain perehdytetyille. <b>Maakohtaisesti:</b> Saksassa vaaditaan kirjallisesti nimetty laserturvallisuusvastaava. Norjassa jokainen luokan 4 laser ilmoitetaan säteilyviranomainen DSA:lle (Altinnin kautta). Ruotsissa käsikäyttö yleisillä paikoilla vaatii SSM:n luvan – selvitämme ennen aloitusta, kuuluuko alueenne siihen. <b>Suositeltu:</b> siirrettävät lasersuojaseinät EN 60825-4:n mukaan.";
T.fi["faq.q6"]="Pitääkö henkilöstö kouluttaa – ja kenen toimesta?";
T.fi["faq.a6"]="<b>Pakollinen:</b> jokainen käyttäjä perehdytetään ennen ensimmäistä käyttöä ja sen jälkeen vuosittain laseriin ja vaarallisiin aineisiin. Yritys tekee sen itse, valtion tarkastuslaitosta ei tarvita. Saksassa yrityksellä on lisäksi oltava vähintään yksi <b>laserturvallisuusvastaava</b>, jolla on DGUV-periaatteen 303-005 mukainen kurssi ja koe: kaksi päivää, tavallisesti 800–1 250 €, kertaus viiden vuoden välein. Kurssin saa järjestää kuka tahansa sopiva kouluttaja, viranomaishyväksyntää ei ole. Sveitsissä nimetään laserturvallisuushenkilö, Itävallassa sitä vaaditaan usein luvassa. Pohjoismaissa perehdytys riittää. <b>Meiltä:</b> laiteperehdytys, valmiit perehdytysmateriaalit ja laserturvallisuusvastaavan kurssi koulutuskumppanin kanssa.";
T.fi["faq.q7"]="Millaisen takuun valmistaja antaa?";
T.fi["faq.a7"]="<b>2 vuotta koko laitteelle.</b> Jos osa hajoaa tänä aikana, valmistaja korjaa tai vaihtaa sen maksutta. Takuu ei koske kulutusosia, ennen kaikkea suojalaseja, eikä käyttövirheistä tai ylivoimaisesta esteestä johtuvia vaurioita. Laserlähde on JPT:n valmistama. Toimitukseen kuuluu 20 suojalasia ja lasersuojalasit, lisäksi käyttöohje, koulutusvideot ja etätuki ympäri vuorokauden.";
T.fi["faq.q8"]="Kuinka nopeasti laite ja varaosat tulevat?";
T.fi["faq.a8"]="Valmistaja rakentaa laitteen 7–9 työpäivässä ennakkomaksusta, lentorahtina se on perillä 18–20 päivää myöhemmin. <b>Varaudu 4–5 viikkoon tilauksesta.</b> Varaosat tulevat pikalähetyksenä noin viikossa. Suojalasit ovat ainoa säännöllinen kulutusosa – pidä aina varastoa.";
T.fi["faq.q9"]="Tuleeko tulli ja kuljetus lisäksi?";
T.fi["faq.a9"]="Laitteet tulevat lentorahtina <b>tullattuina</b> Saksaan. EU:n sisällä – myös Itävaltaan, Ruotsiin, Tanskaan ja Suomeen – ei tule lisää tullia. Norjaan ja Sveitsiin tulee lisäksi tuontitullaus: tulli 0 %, tuonnin arvonlisävero 25 % tai 8,1 %, jonka saatte takaisin ostojen arvonlisäverona. Kuljetuskulut toimipaikkaanne näkyvät tarjouksessa.";
T.fi["faq.note"]="Tilanne lokakuu 2026. Yleistä tietoa, ei oikeudellista neuvontaa. Sovimme toimipaikkanne säännöt kanssanne ja alueen ylläpitäjän kanssa ennen aloitusta.";

   document.getElementById('fvOpen').setAttribute('aria-label',t('fv.big'));document.getElementById('fvOpen').title=t('fv.big');

<script>
(function(){
 var fv=document.getElementById('fv'),head=document.getElementById('fvHead'),pill=document.getElementById('fvShow');if(!fv||!head)return;
 var K='fvPos',drag=null,moved=false;
 function has(){return fv.style.top&&fv.style.top!=='auto';}
 function place(x,y){var r=fv.getBoundingClientRect(),W=innerWidth,H=innerHeight;
   x=Math.max(4,Math.min(W-r.width-4,x));y=Math.max(4,Math.min(H-r.height-4,y));
   fv.style.left=x+'px';fv.style.top=y+'px';fv.style.bottom='auto';fv.style.right='auto';}
 function reclamp(){if(has()){var r=fv.getBoundingClientRect();place(r.left,r.top);}}
 try{var p=JSON.parse(sessionStorage.getItem(K)||'null');if(p&&p.length===2)requestAnimationFrame(function(){place(p[0],p[1]);});}catch(e){}
 function down(e){if(e.button>0||document.body.classList.contains('editing'))return;if(e.target.closest('.fv-x'))return;
   var r=fv.getBoundingClientRect();drag={dx:e.clientX-r.left,dy:e.clientY-r.top,x0:e.clientX,y0:e.clientY,el:e.currentTarget,id:e.pointerId};moved=false;}
 function move(e){if(!drag)return;
   if(!moved){if(Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)<6)return;moved=true;fv.classList.add('dragging');}
   place(e.clientX-drag.dx,e.clientY-drag.dy);e.preventDefault();}
 function up(){if(!drag)return;drag=null;fv.classList.remove('dragging');
   if(moved){var r=fv.getBoundingClientRect();try{sessionStorage.setItem(K,JSON.stringify([r.left,r.top]));}catch(err){}}}
 [head,pill].forEach(function(el){el.addEventListener('pointerdown',down);});
 document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
 pill.addEventListener('click',function(e){if(moved){e.stopImmediatePropagation();e.preventDefault();moved=false;}},true);
 head.addEventListener('dblclick',function(){fv.style.left=fv.style.top=fv.style.bottom=fv.style.right='';try{sessionStorage.removeItem(K);}catch(e){}});
 addEventListener('resize',reclamp);
 new MutationObserver(function(){requestAnimationFrame(reclamp);}).observe(fv,{subtree:true,attributes:true,attributeFilter:['hidden']});
})();
</script>
