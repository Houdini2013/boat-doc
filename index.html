<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Antifouling und Detailing für Marinas und Bootsservice: eigener Rechner, Buchung mit Fotos, Anzahlung oder Ratenkauf, Abtrag per Laser. Deutschland und Norden.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Boatsdoc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Hafenkante — dunkles Wasserband oben mit zwei Türen, darunter helle Abschnitte wie Stationen eines Auftrags. */
:root{
  color-scheme: light;
  --paper:#EAECE8; --card:#FFFFFF; --card-2:#F4F5F2;
  --ink:#10201F; --ink-2:#3D4F4E; --ink-3:#5F706D;
  --line:#CDD3CF; --line-2:#DFE3DF;
  --deep:#12302F; --deep-2:#183C3A; --deep-ink:#E8EDE9; --deep-mut:#A9BCB6;
  --accent:#C24A21; --accent-2:#E2714A; --accent-soft:#F6E2D9;
  --good:#256B4E; --good-soft:#DDEBE2;
  --f-disp:"Archivo", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme: dark;
  --paper:#0B1614; --card:#132321; --card-2:#0F1D1B; --ink:#E6EBE7; --ink-2:#B3C1BC; --ink-3:#8A9B96;
  --line:#2A3F3B; --line-2:#1C2E2B; --deep:#06100E; --deep-2:#0E1C1A; --deep-ink:#E6EBE7; --deep-mut:#94A8A2;
  --accent:#E2714A; --accent-2:#EE8E6C; --accent-soft:#3A1F14; --good:#5CB88C; --good-soft:#12291F;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0B1614; --card:#132321; --card-2:#0F1D1B; --ink:#E6EBE7; --ink-2:#B3C1BC; --ink-3:#8A9B96;
  --line:#2A3F3B; --line-2:#1C2E2B; --deep:#06100E; --deep-2:#0E1C1A; --deep-ink:#E6EBE7; --deep-mut:#94A8A2;
  --accent:#E2714A; --accent-2:#EE8E6C; --accent-soft:#3A1F14; --good:#5CB88C; --good-soft:#12291F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--deep)}
h1,h2,h3{font-family:var(--f-disp); margin:0; letter-spacing:-.025em; line-height:1.08; text-wrap:balance}
h1{font-size:clamp(2.1rem,5.4vw,3.9rem); font-weight:900}
h2{font-size:clamp(1.6rem,3.6vw,2.5rem); font-weight:800}
h3{font-size:1.15rem; font-weight:700; line-height:1.2}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.eye{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.in{max-width:1180px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.lead{font-size:1.12rem; color:var(--ink-2); max-width:62ch}
section.sec{padding-block:clamp(56px,8vw,96px)}
section.sec + section.sec{border-top:1px solid var(--line-2)}
.head{display:flex; flex-direction:column; gap:12px; margin-bottom:34px; max-width:780px}

/* Kopf */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--deep); color:var(--deep-ink); border-bottom:1px solid color-mix(in srgb,var(--deep-ink) 10%,transparent)}
.top .in{display:flex; align-items:center; gap:18px; padding-block:12px}
.brand{font-family:var(--f-disp); font-weight:900; font-size:1.05rem; letter-spacing:-.01em; display:flex; align-items:center; gap:9px; text-decoration:none; white-space:nowrap}
.brand i{width:11px; height:11px; background:var(--accent); border-radius:2px; transform:rotate(45deg); display:inline-block}
nav.main{display:flex; gap:2px; flex:1; overflow-x:auto; scrollbar-width:none; min-width:0}
nav.main a{text-decoration:none; font-size:.88rem; color:var(--deep-mut); padding:6px 10px; border-radius:3px; white-space:nowrap}
nav.main a:hover{color:var(--deep-ink); background:color-mix(in srgb,var(--deep-ink) 8%,transparent)}
.top select{background:transparent; color:var(--deep-ink); border:1px solid color-mix(in srgb,var(--deep-ink) 30%,transparent); border-radius:3px; padding:6px 8px; font:inherit; font-size:.82rem; cursor:pointer}
.top select option{color:#10201F}
.top .cta{background:var(--accent); color:#fff; text-decoration:none; font-weight:600; font-size:.88rem; padding:8px 13px; border-radius:3px; white-space:nowrap}
@media (max-width:820px){ nav.main{display:none} .top .in{justify-content:space-between} }
.top .cta .sm{display:none}
@media (max-width:560px){ .top .cta .lg{display:none} .top .cta .sm{display:inline} .top .in{gap:10px} }

/* Startband */
.hero{background:var(--deep); color:var(--deep-ink); position:relative; overflow:hidden}
.hero canvas{position:absolute; inset:auto 0 0 0; width:100%; height:180px; pointer-events:none; opacity:.55}
.hero .in{position:relative; padding-block:clamp(48px,7vw,88px) clamp(56px,8vw,96px); display:grid; gap:40px}
.hero .eye{color:var(--deep-mut)}
.hero h1{max-width:17ch; margin-top:14px}
.hero h1 em{font-style:normal; color:var(--accent-2)}
.hero .lead{color:color-mix(in srgb,var(--deep-ink) 82%,transparent); margin-top:18px}
.doors{display:grid; gap:14px}
@media(min-width:820px){.doors{grid-template-columns:1fr 1fr}}
.door{display:flex; flex-direction:column; gap:12px; text-decoration:none; color:var(--deep-ink); background:var(--deep-2); border:1px solid color-mix(in srgb,var(--deep-ink) 16%,transparent); border-radius:4px; padding:24px; transition:border-color .15s, transform .15s}
.door:hover{border-color:var(--accent-2); transform:translateY(-2px)}
.door .tag{align-self:flex-start; font-family:var(--f-mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; padding:3px 8px; border-radius:2px; background:color-mix(in srgb,var(--accent) 22%,transparent); color:var(--accent-2)}
.door h3{font-size:1.6rem; font-weight:800}
.door p{color:color-mix(in srgb,var(--deep-ink) 78%,transparent)}
.door .go{margin-top:auto; font-weight:600; color:var(--accent-2)}
.hero .hint{font-size:.95rem; color:var(--deep-mut)}
.hero .hint a{color:var(--deep-ink)}

/* Kreislauf */
.loop{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:4px; overflow:hidden; counter-reset:st}
@media(min-width:900px){.loop{grid-template-columns:repeat(4,1fr)}}
.loop li{list-style:none; background:var(--card); padding:22px; display:flex; flex-direction:column; gap:8px; position:relative}
.loop li .who{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
.loop li p{color:var(--ink-2); font-size:.98rem}
.loop{margin:0; padding:0}
.callout{margin-top:18px; border-left:3px solid var(--good); background:var(--good-soft); padding:14px 16px; border-radius:0 3px 3px 0; max-width:820px}

/* Videos */
.vids{display:grid; gap:18px}
@media(min-width:900px){.vids{grid-template-columns:1fr 1fr}}
.vid{background:var(--card); border:1px solid var(--line); border-radius:4px; overflow:hidden; display:flex; flex-direction:column}
.vid video{display:block; width:100%; aspect-ratio:16/10; background:#0e1816; max-width:100%}
.vid .tx{padding:18px; display:flex; flex-direction:column; gap:8px}
.vid .tx p{color:var(--ink-2); font-size:.96rem}
.btn{display:inline-flex; align-items:center; gap:6px; font:inherit; font-weight:600; font-size:.95rem; text-decoration:none; border-radius:3px; padding:10px 16px; cursor:pointer; border:1px solid var(--ink); background:var(--ink); color:var(--paper)}
.btn.acc{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.small{font-size:.86rem; color:var(--ink-3)}

/* Bedarfscheck */
.calc{display:grid; gap:18px}
@media(min-width:960px){.calc{grid-template-columns:380px 1fr}}
.panel{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:22px}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:18px}
.field label{display:flex; justify-content:space-between; gap:10px; font-weight:600; font-size:.92rem; color:var(--ink-2)}
.field label b{font-family:var(--f-mono); color:var(--ink); font-weight:600}
.field small{color:var(--ink-3); font-size:.8rem}
input[type=range]{width:100%; accent-color:var(--accent); height:24px}
.res{display:flex; flex-direction:column; gap:14px; min-width:0}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:4px; overflow:hidden}
.facts div{background:var(--card); padding:16px}
.facts b{display:block; font-family:var(--f-mono); font-size:1.6rem; font-weight:600; letter-spacing:-.03em; margin-top:4px; font-variant-numeric:tabular-nums}
.opts{display:grid; gap:12px}
@media(min-width:760px){.opts{grid-template-columns:repeat(3,1fr)}}
.opt{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:18px; display:flex; flex-direction:column; gap:6px}
.opt.best{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.opt .v{font-family:var(--f-mono); font-size:1.7rem; font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.opt .v.neg{color:var(--ink-3)}
.opt .be{font-size:.86rem; color:var(--ink-2)}
.opt .best-tag{align-self:flex-start; font-family:var(--f-mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:#fff; background:var(--accent); padding:2px 7px; border-radius:2px}
.foot{font-size:.8rem; color:var(--ink-3); max-width:90ch}

/* Jetzt testen */
.hero .row{margin-top:26px; gap:12px}
.hero-cta{background:var(--accent); border-color:var(--accent); color:#fff; font-size:1.02rem; padding:13px 20px}
.hero-ghost{background:transparent; border-color:color-mix(in srgb,var(--deep-ink) 35%,transparent); color:var(--deep-ink)}
.testen{display:grid; gap:28px}
@media(min-width:900px){.testen{grid-template-columns:1fr 440px; align-items:start}}
.tform{display:flex; flex-direction:column; gap:14px; border-color:var(--accent); box-shadow:0 10px 40px color-mix(in srgb,var(--accent) 12%,transparent)}
.tf{display:flex; flex-direction:column; gap:6px; font-weight:600; font-size:.92rem; color:var(--ink-2); border:0; padding:0; margin:0; min-width:0}
.tf legend{padding:0; margin-bottom:6px}
.tf input,.tf select{font:inherit; font-weight:400; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:3px; padding:10px 12px; width:100%}
.tg{display:grid; gap:12px; grid-template-columns:1fr 1fr}
.rad{display:flex; gap:10px; align-items:center; font-weight:400; padding:6px 0; cursor:pointer}
.rad input{accent-color:var(--accent); width:18px; height:18px}
.tform .btn{justify-content:center; padding:13px; font-size:1rem}
.err{color:var(--accent); font-size:.9rem; min-height:1em; margin:0}

/* Detailing */
.dets{display:grid; gap:12px}
@media(min-width:900px){.dets{grid-template-columns:repeat(3,1fr)}}
.det{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:20px; display:flex; flex-direction:column; gap:8px}
.det .pr{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:1.25rem; font-weight:600; letter-spacing:-.02em; margin-top:auto; padding-top:10px; border-top:1px solid var(--line-2)}
.det .pr small{display:block; font-family:var(--f-body); font-size:.8rem; font-weight:400; color:var(--ink-3); letter-spacing:0}
.det p{color:var(--ink-2); font-size:.95rem}
.det ul{margin:0; padding-left:18px; color:var(--ink-2); font-size:.9rem; display:flex; flex-direction:column; gap:3px}

/* Zeitplan */
.plan{display:grid; gap:12px; margin:0; padding:0}
@media(min-width:900px){.plan{grid-template-columns:repeat(4,1fr)}}
.plan li{list-style:none; background:var(--card); border:1px solid var(--line); border-top:4px solid var(--line); border-radius:4px; padding:18px; display:flex; flex-direction:column; gap:8px}
.plan li:first-child{border-top-color:var(--accent)}
.plan li .when{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.plan li p{color:var(--ink-2); font-size:.96rem}
.kit{margin-top:22px; display:flex; flex-wrap:wrap; gap:8px}
.kit span{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 13px; font-size:.9rem}

/* Rollen */
.two{display:grid; gap:18px}
@media(min-width:900px){.two{grid-template-columns:1.1fr .9fr; align-items:start}}
.steps3{display:grid; gap:10px; margin:0; padding:0}
.steps3 li{list-style:none; display:grid; grid-template-columns:40px 1fr; gap:12px; align-items:start; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:16px}
.steps3 li b{font-family:var(--f-mono); font-size:1.1rem; color:var(--accent)}
.steps3 li p{color:var(--ink-2); font-size:.95rem; margin-top:2px}
.money{background:var(--deep); color:var(--deep-ink); border-radius:4px; padding:22px; display:flex; flex-direction:column; gap:12px}
.money .eye{color:var(--deep-mut)}
.money .big{font-family:var(--f-mono); font-size:2.3rem; font-weight:600; letter-spacing:-.03em}
.money p{color:color-mix(in srgb,var(--deep-ink) 82%,transparent)}
.money a{color:var(--accent-2)}
ul.check{margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
ul.check li{list-style:none; display:grid; grid-template-columns:20px 1fr; gap:10px; color:var(--ink-2)}
ul.check li::before{content:""; width:10px; height:10px; margin-top:.5em; background:var(--accent); transform:rotate(45deg); border-radius:1px}
ul.check li b{color:var(--ink)}
.money ul.check li{color:color-mix(in srgb,var(--deep-ink) 82%,transparent)} .money ul.check li b{color:var(--deep-ink)}

/* Finanzierung */
.fin{display:grid; gap:18px}
@media(min-width:900px){.fin{grid-template-columns:1fr 1fr}}
table.t{width:100%; border-collapse:collapse; font-size:.93rem; margin-top:10px}
table.t td{padding:9px 0; border-top:1px solid var(--line-2); vertical-align:top}
table.t td:last-child{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums; padding-left:12px}

/* Technik */
.tech{display:grid; gap:24px}
@media(min-width:900px){.tech{grid-template-columns:1fr 1fr; align-items:start}}
.tech video{width:100%; border-radius:4px; background:#000; display:block; max-width:100%}

/* Fragen */
details{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:0 18px}
details + details{margin-top:8px}
summary{cursor:pointer; font-weight:600; padding:16px 0; list-style:none; display:flex; justify-content:space-between; gap:14px}
summary::after{content:"+"; font-family:var(--f-mono); color:var(--accent)}
details[open] summary::after{content:"–"}
details p{padding:0 0 18px; color:var(--ink-2); max-width:75ch}

/* Kontakt + Fuß */
.contact{background:var(--deep); color:var(--deep-ink)}
.contact .in{padding-block:clamp(48px,7vw,80px); display:grid; gap:20px}
.contact .lead{color:color-mix(in srgb,var(--deep-ink) 80%,transparent)}
.mail{display:flex; flex-wrap:wrap; align-items:center; gap:12px}
.mail code{font-family:var(--f-mono); font-size:1.25rem; background:var(--deep-2); border:1px solid color-mix(in srgb,var(--deep-ink) 18%,transparent); padding:10px 14px; border-radius:3px; user-select:all}
.contact .btn{background:var(--accent); border-color:var(--accent); color:#fff}
footer{background:var(--deep); color:var(--deep-mut); border-top:1px solid color-mix(in srgb,var(--deep-ink) 10%,transparent); font-size:.88rem}
footer .in{padding-block:22px; display:flex; flex-wrap:wrap; gap:10px 22px; justify-content:space-between}
footer a{color:var(--deep-ink)}
footer nav{display:flex; flex-wrap:wrap; gap:6px 18px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 22px); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:3px; z-index:95}
</style>

</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="#start"><i></i>BOATSDOC</a>
  <nav class="main" aria-label="Seiten">
    <a href="#marina" data-t="n_marina"></a><a href="#werkstatt" data-t="n_werkstatt"></a><a href="#ablauf" data-t="n_ablauf"></a>
    <a href="#detailing" data-t="n_det"></a><a href="#bedarf" data-t="n_bedarf"></a><a href="#finanzierung" data-t="n_fin"></a><a href="#technik" data-t="n_technik"></a><a href="ueber-uns.html" data-t="n_ueber"></a>
  </nav>
  <select id="lang" aria-label="Language"></select>
  <a class="cta" href="#kontakt"><span class="lg" data-t="cta"></span><span class="sm" data-t="cta_s"></span></a>
</div></header>

<section class="hero" id="start">
  <canvas id="wave" aria-hidden="true"></canvas>
  <div class="in">
    <div>
      <div class="eye" data-t="h_eye"></div>
      <h1 data-t="h_h1"></h1>
      <p class="lead" data-t="h_lead"></p>
    </div>
    <div class="doors">
      <a class="door" href="#marina"><span class="tag" data-t="d1_tag"></span><h3 data-t="d1_h"></h3><p data-t="d1_p"></p><span class="go" data-t="d1_go"></span></a>
      <a class="door" href="#werkstatt"><span class="tag" data-t="d2_tag"></span><h3 data-t="d2_h"></h3><p data-t="d2_p"></p><span class="go" data-t="d2_go"></span></a>
    </div>
    <div class="row"><a class="btn hero-cta" href="#testen" data-t="h_cta"></a><a class="btn hero-ghost" href="#kalkulator" data-t="h_vid"></a></div>
    <p class="hint" data-t="h_hint"></p>
  </div>
</section>

<section class="sec" id="ablauf"><div class="in">
  <div class="head"><div class="eye" data-t="a_eye"></div><h2 data-t="a_h"></h2></div>
  <ol class="loop">
    <li><span class="who" data-t="a1_w"></span><h3 data-t="a1_h"></h3><p data-t="a1_p"></p></li>
    <li><span class="who" data-t="a2_w"></span><h3 data-t="a2_h"></h3><p data-t="a2_p"></p></li>
    <li><span class="who" data-t="a3_w"></span><h3 data-t="a3_h"></h3><p data-t="a3_p"></p></li>
    <li><span class="who" data-t="a4_w"></span><h3 data-t="a4_h"></h3><p data-t="a4_p"></p></li>
  </ol>
  <p class="callout" data-t="a_note"></p>
</div></section>

<section class="sec" id="kalkulator"><div class="in">
  <div class="head"><div class="eye" data-t="v_eye"></div><h2 data-t="v_h"></h2><p class="lead" data-t="v_lead"></p></div>
  <div class="vids">
    <div class="vid"><video id="vidE" data-name="eigner" controls preload="metadata" playsinline poster="poster-eigner-de.jpg"><source src="anleitung-eigner-de.mp4" type="video/mp4"></video>
      <div class="tx"><div class="eye" data-t="v1_eye"></div><h3 data-t="v1_h"></h3><p data-t="v1_p"></p><div class="row"><a class="btn acc" href="kalkulator.html?p=beispiel-marina" target="_blank" rel="noopener" data-t="v1_btn"></a></div></div></div>
    <div class="vid"><video id="vidM" data-name="marina" controls preload="metadata" playsinline poster="poster-marina-de.jpg"><source src="anleitung-marina-de.mp4" type="video/mp4"></video>
      <div class="tx"><div class="eye" data-t="v2_eye"></div><h3 data-t="v2_h"></h3><p data-t="v2_p"></p><div class="row"><a class="btn" href="#testen" data-t="v2_btn2"></a></div></div></div>
  </div>
  <p class="small" style="margin-top:14px" data-t="v_note"></p>
</div></section>

<section class="sec" id="testen"><div class="in testen">

<script src="core.js"></script>
<script src="store.js"></script>
<script src="texte-start.js"></script>
<script>
"use strict";
const C = window.BoatsdocCore, TX = window.TX_START;
const SPR = ["de","en","sv","no","da","fi"], LOC = {de:"de-DE",en:"en-GB",sv:"sv-SE",no:"nb-NO",da:"da-DK",fi:"fi-FI"};
let L = "de";
try { L = localStorage.getItem("bd_site_lang") || ""; } catch(_){}
if (!SPR.includes(L)) { const n = (navigator.language||"de").slice(0,2).toLowerCase(); L = SPR.includes(n) ? n : (n === "nb" || n === "nn") ? "no" : "en"; }
const t = (k, v) => { let s = (TX[L] && TX[L][k] != null) ? TX[L][k] : (TX.de[k] ?? ""); if (v) for (const [a,b] of Object.entries(v)) s = s.split("{"+a+"}").join(b); return s; };
const eur = (n, d) => (Number(n)||0).toLocaleString(LOC[L], {style:"currency", currency:"EUR", maximumFractionDigits:d ?? 0, minimumFractionDigits:d ?? 0});
const nf = n => (Number(n)||0).toLocaleString(LOC[L], {maximumFractionDigits:0});
const $ = id => document.getElementById(id);
const G = C.GERAETE, R500 = G.bd500.preis * G.bd500.faktor60 / 100, R1000 = G.bd1000.preis * G.bd1000.faktor60 / 100;

function render(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
  $("lang").innerHTML = SPR.map(l => `<option value="${l}"${l===L?" selected":""}>${TX[l].sprache}</option>`).join("");
  $("kit").innerHTML = t("t_kit").split("|").map(x => `<span>${x}</span>`).join("");
  $("wList").innerHTML = t("w_list").split("|").map(x => `<li><span>${x}</span></li>`).join("");
  $("wTerms").innerHTML = t("w_terms").split("|").map(x => `<li><span>${x}</span></li>`).join("");
  $("xList").innerHTML = t("x_list").split("|").map(x => `<li><span>${x}</span></li>`).join("");
  $("faq").innerHTML = t("faq").split("||").map(x => { const [q,a] = x.split("|"); return `<details><summary>${q}</summary><p>${a}</p></details>`; }).join("");
  $("dets").innerHTML = ["pflege","restau","keramik"].map(pk => { const r = C.richtpreisDet(C.grundpreise(), 10.4, 3.6, "kurzkieler", pk, "mittel");
    return `<div class="det"><span class="eye">${t("dt_"+pk+"_e")}</span><h3>${t("dt_"+pk+"_h")}</h3><p>${t("dt_"+pk+"_p")}</p><ul>${t("dt_"+pk+"_l").split("|").map(x=>`<li>${x}</li>`).join("")}</ul>
      <div class="pr">${eur(r.von)} – ${eur(r.bis)}<small>${t("dt_pr")}</small></div></div>`; }).join("");
  /* Anleitungsvideos in der gewählten Sprache */
  for (const v of [$("vidE"), $("vidM")]) { const src = `anleitung-${v.dataset.name}-${L}.mp4`, so = v.querySelector("source");
    if (!so.getAttribute("src").endsWith(src)) { so.setAttribute("src", src); v.poster = `poster-${v.dataset.name}-${L}.jpg`; v.load(); } }
  testenRender();
  $("mBig").textContent = eur(400);
  $("wBig").textContent = t("w_ab", {r: eur(R500)});
  const K = C.FINANZIERER.klarna.rahmen;
  $("finTab").innerHTML = ["DE","SE","NO","FI","DK"].map(c => `<tr><td>${landName(c)}</td><td>${K[c] ? t("bis",{b:eur(K[c][1])}) : t("f1_dk")}</td></tr>`).join("");
  $("grenkeTab").innerHTML = Object.values(G).map(g => `<tr><td>${g.name}<br><span class="small">${t("geraet",{p:eur(g.preis)})}</span></td><td>${eur(g.preis*g.faktor60/100)} / ${t("monat")}</td></tr>`).join("");
  rechne();
}
function landName(c){ try { return new Intl.DisplayNames([LOC[L]],{type:"region"}).of(c); } catch(_){ return c; } }

/* Bedarfscheck */
function rechne(){
  const P = +$("bP").value, A = +$("bA").value / 100, PR = +$("bPr").value, DB = +$("bD").value / 100;
  $("vP").textContent = nf(P); $("vA").textContent = nf(A*100) + " %"; $("vPr").textContent = eur(PR); $("vD").textContent = nf(DB*100) + " %";
  const bedarf = Math.round(P * 0.2), n = Math.round(P * 0.2 * A), U = n * PR;
  $("f1").textContent = nf(bedarf); $("f2").textContent = nf(n); $("f3").textContent = eur(U);
  const proBoot = PR * (DB - C.GEBUEHR), zv = 20 * 45 * (PR / 3950);  // BD-1000 spart ~20 h je 33-m²-Boot gegenüber BD-500
  const opts = [
    {k:"o1", v: U * (C.PROVISION - C.GEBUEHR), be: t("o1_be")},
    {k:"o2", v: n * proBoot - R500 * 12, be: proBoot > 0 ? t("o_be", {n: Math.ceil(R500*12 / proBoot)}) : t("o_nie")},
    {k:"o3", v: n * (proBoot + zv) - R1000 * 12, be: (proBoot + zv) > 0 ? t("o_be", {n: Math.ceil(R1000*12 / (proBoot + zv))}) : t("o_nie")}
  ];
  const best = opts.reduce((a, b) => b.v > a.v ? b : a);
  $("opts").innerHTML = opts.map(o => `<div class="opt${o === best ? " best" : ""}">${o === best ? `<span class="best-tag">${t("best")}</span>` : ""}
    <span class="eye">${t(o.k+"_eye")}</span><h3>${t(o.k+"_h")}</h3><span class="v${o.v < 0 ? " neg" : ""}">${o.v < 0 ? "−" : ""}${eur(Math.abs(o.v))}</span><span class="small">${t("pro_jahr")}</span><span class="be">${o.be}</span></div>`).join("");
}
["bP","bA","bPr","bD"].forEach(id => $(id).addEventListener("input", rechne));
/* Jetzt testen: eigener Probezugang, direkt ins Backend */
function testenRender(){
  $("teList").innerHTML = t("te_list").split("|").map(x => `<li><span>${x}</span></li>`).join("");
  const l = $("teLand").value || "DE";
  $("teLand").innerHTML = ["DE","SE","NO","DK","FI"].map(c => `<option value="${c}"${c===l?" selected":""}>${landName(c)}</option>`).join("");
  $("teName").placeholder = t("te_name_ph");
}
$("teForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("teName").value.trim();
  if (name.length < 2) { $("teErr").textContent = t("te_err_name"); $("teName").focus(); return; }
  $("teBtn").disabled = true; $("teErr").textContent = "";
  try {
    await window.Boatsdoc.call("POST", "/api/probe", { name, land: $("teLand").value, liegeplaetze: +$("tePl").value || +$("bP").value || null,
      rolle: document.querySelector("[name=teR]:checked").value, sprache: L, quelle: "website" });
    location.href = "partner.html#start";
  } catch(x) { $("teErr").textContent = x.message || t("te_err"); $("teBtn").disabled = false; }
});
$("bP").addEventListener("change", () => { if (!$("tePl").value) $("tePl").placeholder = $("bP").value; });
$("lang").addEventListener("change", e => { L = e.target.value; try { localStorage.setItem("bd_site_lang", L); } catch(_){} render(); });
$("cpMail").addEventListener("click", async e => {
  const show = m => { const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); };
  try { await navigator.clipboard.writeText("partner@boatsdoc.eu"); show(t("kopiert")); }
  catch(_) { const r = document.createRange(); r.selectNodeContents($("mailAddr")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); show(t("markiert")); }
});
/* Startpreis aus der gemeinsamen Formel (25 m², Antifouling neu) */
$("bPr").value = Math.round(C.richtpreis(C.grundpreise(), 25, "af").netto / 50) * 50;
render();

/* Wasserlinie im Startband */
(function(){
  const cv = $("wave"), ctx = cv.getContext("2d"); let w, h, t0 = 0;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ w = cv.width = cv.offsetWidth * devicePixelRatio; h = cv.height = cv.offsetHeight * devicePixelRatio; }
  function draw(){
    ctx.clearRect(0,0,w,h);
    const acc = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#C24A21";
    for (let k = 0; k < 4; k++){
      ctx.beginPath();
      for (let x = 0; x <= w; x += 8){ const y = h*0.35 + k*h*0.16 + Math.sin(x/(140*devicePixelRatio) + t0*(0.6+k*0.15) + k) * (7+k*3) * devicePixelRatio; x ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
      ctx.strokeStyle = k === 0 ? acc : "rgba(232,237,233," + (0.22 - k*0.04) + ")"; ctx.lineWidth = (k === 0 ? 2 : 1) * devicePixelRatio; ctx.stroke();
    }
    t0 += 0.012; if (!still) requestAnimationFrame(draw);
  }
  size(); addEventListener("resize", size); draw();
})();
if (location.hash) setTimeout(() => { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }, 50);
</script>
