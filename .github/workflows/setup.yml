# Einmalig von Hand starten (Actions → „Server einrichten“ → Run workflow), nachdem der VPS gebucht ist.
name: Server einrichten
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain
        default: boatsdoc.com
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH vorbereiten
        run: |
          test -n "$VPS_HOST" || { echo "Secret VPS_HOST fehlt"; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Einrichten
        run: |
          ssh root@$VPS_HOST 'mkdir -p /srv/boatsdoc/app; command -v rsync || (apt-get update -y && apt-get install -y rsync)'
          rsync -az --delete --exclude .git --exclude .github --exclude data ./ root@$VPS_HOST:/srv/boatsdoc/app/
          ssh root@$VPS_HOST "DOMAIN='${{ inputs.domain }}' bash /srv/boatsdoc/app/deploy/setup.sh"
