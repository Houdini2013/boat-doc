<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antifouling-Rechner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1816; --bg2:#121f1c; --panel:#172522; --panel2:#1c2b27; --line:#2a3a36; --line2:#344642;
    --txt:#e9eeeb; --mut:#8c9a95; --dim:#5f6e69;
    --acc:#c4532f; --acc2:#d9643d; --accsoft:#ff9d6e; --ok:#5fb88a;
    --sans:"Hanken Grotesk","Inter Tight","Helvetica Neue",Arial,sans-serif;
    --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono)}
  .eyebrow,label.l,.kpi-l{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}

  /* Kopf */
  .top{position:sticky;top:0;z-index:10;background:rgba(14,24,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.25rem;letter-spacing:-.01em;text-transform:uppercase}
  .logo i{width:16px;height:16px;background:var(--acc);transform:rotate(45deg);border-radius:3px;flex:none}
  .spacer{flex:1}
  .sel-wrap{position:relative}
  .sel-wrap select{font-family:var(--mono);font-size:.85rem;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);
        border-radius:6px;padding:8px 32px 8px 12px;-webkit-appearance:none;appearance:none;cursor:pointer;width:auto}
  .sel-wrap::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);
        transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .strap{border-bottom:1px solid var(--line);background:var(--bg)}
  .strap div{max-width:1040px;margin:0 auto;padding:11px 16px}

  main{max-width:1040px;margin:0 auto;padding:22px 16px 70px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}

  /* Rechner */
  .calc-h{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
  .badge{width:46px;height:46px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-weight:800;font-size:1rem;flex:none}
  .calc-h h2{font-size:1.28rem;font-weight:800;letter-spacing:-.015em;line-height:1.2}
  .calc-h p{color:var(--mut);font-size:.95rem}
  .calc-b{padding:6px 20px 22px}
  .grp{margin-top:22px}
  .grp>label.l{display:block;margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr;gap:0 36px}
  @media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font:inherit;font-size:.95rem;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-radius:4px;
        padding:10px 16px;cursor:pointer;text-align:left;transition:background .12s,border-color .12s}
  .chip:hover{border-color:var(--mut)}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .chip:focus-visible,.slider:focus-visible,select:focus-visible,input:focus-visible,.drop:focus-visible{outline:2px solid var(--accsoft);outline-offset:2px}
  .hint{color:var(--mut);font-size:.88rem;margin-top:10px}

  .sl-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .sl-h .v{font-family:var(--mono);font-size:1.05rem;color:var(--txt)}
  .slider{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;outline:none;cursor:pointer;
        background:linear-gradient(90deg,var(--accsoft) var(--p,50%),#363a39 var(--p,50%))}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;width:42px;height:26px;border-radius:99px;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .slider::-moz-range-thumb{width:42px;height:26px;border-radius:99px;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .slider::-moz-range-track{background:transparent}

  .tools{display:grid;grid-template-columns:1fr;gap:14px;margin-top:22px}
  @media(min-width:760px){.tools{grid-template-columns:1fr 1fr}}
  select.plain{width:100%;font:inherit;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:11px 36px 11px 12px;
        -webkit-appearance:none;appearance:none;
        background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
        background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat}
  .drop{border:1px dashed var(--line2);border-radius:4px;padding:13px 14px;text-align:center;color:var(--mut);cursor:pointer;background:var(--bg2);font-size:.92rem}
  .drop strong{color:var(--txt);font-weight:600}
  .drop img{max-width:100%;max-height:150px;margin-top:10px;border-radius:4px;display:block;margin-left:auto;margin-right:auto}
  .note{border-left:2px solid var(--acc);background:var(--bg2);padding:9px 12px;font-size:.85rem;color:var(--mut);margin-top:10px}

  /* Ergebnis */
  .result{margin-top:24px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);padding:22px 20px}
  .price{font-family:var(--mono);font-weight:700;font-size:clamp(1.7rem,6.4vw,3rem);letter-spacing:-.03em;line-height:1.1;margin:8px 0 4px;color:#fff;word-break:break-word}
  .vat{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accsoft)}
  .net{font-family:var(--mono);font-size:.82rem;color:var(--mut);margin-top:6px;min-height:1.2em}
  .meta{display:grid;grid-template-columns:1fr;gap:16px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
  @media(min-width:640px){.meta{grid-template-columns:auto 1fr;gap:40px}}
  .meta b{display:block;font-family:var(--mono);font-size:1.5rem;font-weight:700;margin-top:4px}
  .meta b small{font-size:.8rem;font-weight:400;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
  .region{margin-top:18px}
  .region label.l{display:block;margin-bottom:8px}
  .inkl{list-style:none;margin-top:18px;border-top:1px solid var(--line)}
  .inkl li{padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem;display:flex;gap:10px}
  .inkl li::before{content:"";width:8px;height:8px;background:var(--acc);transform:rotate(45deg);margin-top:.5em;flex:none;border-radius:1px}
  .eco{margin-top:16px;color:var(--mut);font-size:.9rem}
  .legal{margin-top:12px;color:var(--dim);font-size:.82rem}

  /* Ablauf */
  .sec-t{margin:34px 0 14px}
  .steps{list-style:none;display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
  @media(min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
  .steps li{padding:18px 18px 20px;border-bottom:1px solid var(--line)}
  @media(min-width:700px){.steps li{border-right:1px solid var(--line)}.steps li:nth-child(3n){border-right:0}.steps li:nth-last-child(-n+3){border-bottom:0}}
  .steps li:last-child{border-bottom:0}
  .steps .n{font-family:var(--mono);font-size:.85rem;color:var(--acc2)}
  .steps strong{display:block;font-size:1.1rem;font-weight:700;letter-spacing:-.01em;margin:6px 0 4px}
  .steps small{color:var(--mut);font-size:.92rem;display:block}

  /* Formular */
  .form{padding:20px}
  .form .fgrid{display:grid;grid-template-columns:1fr;gap:0 24px}
  @media(min-width:700px){.form .fgrid{grid-template-columns:1fr 1fr}}
  .form label.l{display:block;margin:16px 0 6px}
  .form input{width:100%;font:inherit;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:12px;-webkit-appearance:none;appearance:none}
  .form input::placeholder{color:var(--dim)}
  button.cta{font:inherit;font-weight:700;width:100%;margin-top:22px;padding:15px;background:var(--acc);color:#fff;border:0;border-radius:4px;cursor:pointer;
        font-family:var(--mono);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase}
  button.cta:hover{background:var(--acc2)}
  .err{display:none;margin-top:12px;color:#ffb59b;font-size:.9rem;border-left:2px solid var(--acc);padding-left:10px}
  .ok{padding:22px;border:1px solid var(--ok);border-radius:6px;color:var(--ok);font-weight:600}
  footer{text-align:center;color:var(--dim);margin-top:40px}

  .hero{font-weight:800;letter-spacing:-.03em;line-height:1.08;font-size:clamp(1.9rem,6.4vw,3.3rem);margin:4px 0 22px}
  .hero span{display:inline-block;margin-right:.32em;white-space:nowrap}
  .hero i{font-style:normal;color:var(--acc2)}
  .tin{width:100%;font:inherit;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:11px 12px;-webkit-appearance:none;appearance:none}
  .tin::placeholder{color:var(--dim)}
  .payrow{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:4px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;font-size:.92rem}
  .payrow .kpi-l{color:var(--accsoft)}
  .blk{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
  .th{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--bg2);border:1px solid var(--line2);display:grid;place-items:center;
      font-family:var(--mono);font-size:.68rem;color:var(--mut);text-align:center;padding:6px;word-break:break-all}
  .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .th button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;cursor:pointer;font-size:15px;line-height:1}
  .mstat{font-family:var(--mono);font-size:.82rem;color:var(--mut);margin-top:10px}
  .mstat.good{color:var(--ok)} .mstat.bad{color:#ffb59b}
  .cal{max-width:390px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);padding:12px;margin-top:12px}
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;text-transform:capitalize}
  .cal-h button{font:inherit;width:36px;height:36px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);border-radius:4px;cursor:pointer}
  .cal-h button:disabled{opacity:.3;cursor:default}
  .cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .cal-w{font-family:var(--mono);font-size:.68rem;color:var(--dim);text-align:center;padding:4px 0;text-transform:uppercase}
  .cal-d{aspect-ratio:1;min-width:0;padding:0;font-family:var(--mono);font-size:.88rem;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--dim);cursor:default}
  .cal-d.ok{color:var(--txt);background:var(--bg2);border-color:var(--line2);cursor:pointer}
  .cal-d.ok:hover{border-color:var(--accsoft)}
  .cal-d.in{background:rgba(196,83,47,.28);color:#fff;border-color:transparent}
  .cal-d.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .cal-d:focus-visible{outline:2px solid var(--accsoft);outline-offset:1px}
  .abo{margin-top:18px;border:1px dashed var(--accsoft);border-radius:6px;padding:14px 16px;background:rgba(255,157,110,.05)}
  .aboHead{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:700}
  .aboHead input{width:18px;height:18px;margin-top:3px;accent-color:var(--acc);flex:none}
  .aboD{color:var(--mut);font-size:.9rem;margin:8px 0 0 28px}
  .aboP{margin:12px 0 0 28px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline}
  .aboP b{font-family:var(--mono);font-size:1.2rem;color:#fff}
  .aboP small{font-family:var(--mono);font-size:.74rem;color:var(--accsoft);letter-spacing:.08em;text-transform:uppercase}
  .abo .inkl{margin:12px 0 0 28px}
  .abo .legal{margin-left:28px}
  .checks{margin-top:6px;display:grid;gap:12px}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--mut);cursor:pointer}
  .form .chk input{width:18px;height:18px;padding:0;margin-top:3px;flex:none;accent-color:var(--acc);-webkit-appearance:auto;appearance:auto}
  .finrow{margin-top:8px;padding:11px 14px;border:1px solid var(--line);border-left:2px solid var(--ok);border-radius:4px;font-size:.92rem;color:var(--txt)}
  .finrow b{font-family:var(--mono);color:var(--ok)}
  .finrow small{display:block;color:var(--mut);font-size:.78rem;margin-top:2px}
  footer .by{display:block;margin-top:6px;opacity:.7}
  .ok a{color:var(--txt)}
  .ok .code{display:block;margin-top:10px;font-family:var(--mono);font-size:.8rem;word-break:break-all;color:var(--mut)}
  body.lade main{opacity:.35;pointer-events:none}
  .gone{padding:40px 16px;text-align:center;color:var(--mut)}
  .probeban{max-width:1040px;margin:12px auto 0;padding:10px 14px;border:1px dashed var(--accsoft);border-radius:4px;font-size:.88rem;color:var(--txt);background:rgba(255,157,110,.06)}
  .probeban b{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accsoft);margin-right:8px}
  .logo img{height:30px;width:auto;display:block;border-radius:3px;background:#fff;padding:2px 4px}
</style>
</head>
<body class="lade">

<header class="top">
  <div class="top-in">
    <div class="logo" id="pLogo"><i></i><span id="pName">&nbsp;</span></div>
    <div class="spacer"></div>
    <div class="sel-wrap"><select id="langSel" aria-label="Language"></select></div>
  </div>
</header>
<div class="strap"><div class="eyebrow" data-i18n="claim"></div></div>
<div class="probeban" id="probeBan" hidden></div>

<main>
  <h1 class="hero" id="hero"></h1>

  <section class="panel" id="calc">
    <div class="calc-h">
      <div class="badge">BD</div>
      <div><h2 data-i18n="s2"></h2><p data-i18n="calcSub"></p></div>
    </div>
    <div class="calc-b">

      <div class="grp" style="margin-top:18px">
        <label class="l" data-i18n="lProd"></label>
        <div class="chips" id="prodChips"></div>
      </div>

      <div class="grp">
        <label class="l" data-i18n="s1"></label>
        <div class="chips" id="pkgChips"></div>
        <p class="hint" id="pkgDesc"></p>
      </div>

      <div class="grp">
        <label class="l" data-i18n="lMat"></label>
        <div class="chips" id="matChips"></div>
        <input type="hidden" id="material" value="gfk">
        <p class="hint" id="matHint" style="display:none"></p>
      </div>

      <div class="tools">
        <div>
          <label class="l eyebrow" for="bootSelect" data-i18n="lBoat" style="display:block;margin-bottom:8px"></label>
          <select class="plain" id="bootSelect"></select>
        </div>
        <div id="otherBox" style="display:none">
          <label class="l eyebrow" for="lOther" data-i18n="lOther" style="display:block;margin-bottom:8px"></label>
          <input class="tin" id="lOther" maxlength="300">
        </div>
      </div>

      <div class="grid2">
        <div class="grp">
          <div class="sl-h"><label class="l" for="lwl" data-i18n="lLwl" id="lblLwl"></label><span class="v" id="vLwl"></span></div>
          <input type="range" class="slider" id="lwl" min="4" max="18" step="0.1" value="8.6">
        </div>
        <div class="grp">
          <div class="sl-h"><label class="l" for="breite" data-i18n="lBeam"></label><span class="v" id="vBreite"></span></div>
          <input type="range" class="slider" id="breite" min="1.5" max="6" step="0.1" value="3.1">
        </div>
        <div class="grp" id="grpTief">
          <div class="sl-h"><label class="l" for="tiefgang" data-i18n="lDraft"></label><span class="v" id="vTief"></span></div>
          <input type="range" class="slider" id="tiefgang" min="0.2" max="3" step="0.1" value="1.7">
        </div>
        <div class="grp">
          <label class="l" data-i18n="lHull"></label>
          <div class="chips" id="hullChips"></div>
          <input type="hidden" id="bootstyp" value="kurzkieler">
        </div>
      </div>

      <div class="grp">
        <label class="l" data-i18n="lCond"></label>
        <div class="chips" id="condChips"></div>
        <input type="hidden" id="zustand" value="mittel">
      </div>

      <div class="result" aria-live="polite">
        <div class="kpi-l" data-i18n="kPrice"></div>
        <div class="price" id="preisSpanne"></div>
        <div class="vat" id="vatLbl"></div>
        <div class="net" id="netLine"></div>
        <div class="region" id="regionBox" style="display:none">
          <label class="l" for="regionSel" data-i18n="region"></label>
          <select class="plain" id="regionSel"></select>
        </div>
        <div class="meta">
          <div><span class="kpi-l" data-i18n="kTime"></span><b><span id="dauer"></span> <small data-i18n="kDays"></small></b></div>
          <div class="eco" data-i18n="eco" style="margin:0"></div>
        </div>
        <div class="payrow"><span class="kpi-l" data-i18n="payT"></span><span data-i18n="payLine"></span></div>
        <div class="finrow" id="finLine" hidden></div>
        <ul class="inkl" id="inklListe"></ul>
        <div class="abo" id="aboBox" style="display:none">
          <label class="aboHead"><input type="checkbox" id="aboChk"><span id="aboT"></span></label>
          <p class="aboD" id="aboD"></p>
          <div class="aboP"><span class="kpi-l" data-i18n="aboKpi"></span><b id="aboPreis"></b><small id="aboPer"></small></div>
          <ul class="inkl" id="aboList"></ul>
          <p class="legal" data-i18n="aboLegal"></p>
        </div>
        <p class="legal"><span id="travelTxt"></span><br><span data-i18n="binding"></span><span id="fxNote" style="display:block;margin-top:4px"></span></p>
      </div>
    </div>
  </section>

  <div class="eyebrow sec-t" id="procT"></div>
  <ul class="steps" id="procList"></ul>

  <div class="eyebrow sec-t" data-i18n="s4"></div>
  <section class="panel form">
    <div id="leadForm">

      <div class="blk">
        <div class="eyebrow" data-i18n="mediaT"></div>
        <p class="hint" data-i18n="mediaHint"></p>
        <div class="drop" id="drop" tabindex="0" role="button" style="margin-top:12px"><div id="dropText"></div></div>
        <input type="file" id="fileInput" accept="image/*,video/*,.heic,.heif" multiple style="display:none">
        <div class="thumbs" id="thumbs"></div>
        <div class="mstat" id="mStat"></div>
      </div>

      <div class="blk">
        <div class="eyebrow" data-i18n="calT"></div>
        <p class="hint" data-i18n="calHint"></p>
        <div class="cal" id="cal"></div>
        <div class="mstat" id="calSel"></div>
      </div>

      <div class="fgrid">
        <div><label class="l" for="lName"><span data-i18n="fName"></span> *</label><input id="lName" autocomplete="name"></div>
        <div><label class="l" for="lEmail"><span data-i18n="fMail"></span> *</label><input id="lEmail" type="email" autocomplete="email"></div>
        <div><label class="l" for="lPlz"><span data-i18n="fZip"></span> *</label><input id="lPlz" maxlength="8" autocomplete="postal-code"></div>
        <div><label class="l" for="lTel" data-i18n="fTel"></label><input id="lTel" type="tel" autocomplete="tel"></div>
        <div style="grid-column:1/-1"><label class="l" for="lMsg" data-i18n="fMsg"></label><input id="lMsg"></div>
      </div>

      <div class="checks" id="checks" style="margin-top:20px"></div>
      <button class="cta" id="leadBtn" data-i18n="fSend"></button>
      <div class="err" id="leadErr"></div>
    </div>
    <div class="ok" id="leadOk" style="display:none" data-i18n="fThanks"></div>
  </section>

  <footer class="eyebrow"><span data-i18n="footer"></span><span class="by" id="pBy"></span></footer>
</main>

<script src="core.js"></script>
<script src="store.js"></script>
<script>
"use strict";

/* ================= I18N ================= */
const I18N = {
 de:{locale:"de-DE",claim:"Bootsrumpf abschleifen & neu beschichten — schnell, sauber, planbar",

const spanneTxt = (a, b) => a === b ? money(a) : `${money(a)} – ${money(b)}`;
const money = (n, dec) => n.toLocaleString(T().locale, {style:"currency", currency:waehrung(), minimumFractionDigits:dec||0, maximumFractionDigits:dec||0});

const TZ_LAND = {
  "Europe/Berlin":"DE","Europe/Busingen":"DE","Europe/Stockholm":"SE","Europe/Oslo":"NO","Europe/Copenhagen":"DK",
  "Europe/Helsinki":"FI","Europe/London":"GB","Europe/Belfast":"GB","Europe/Amsterdam":"NL","Europe/Brussels":"BE",
  "Europe/Luxembourg":"LU","Europe/Paris":"FR","Europe/Vienna":"AT","Europe/Zurich":"CH","Europe/Vaduz":"LI",
  "Europe/Warsaw":"PL","Europe/Tallinn":"EE","Europe/Riga":"LV","Europe/Vilnius":"LT","Europe/Dublin":"IE",
  "Europe/Madrid":"ES","Atlantic/Canary":"ES","Europe/Lisbon":"PT","Atlantic/Madeira":"PT","Atlantic/Azores":"PT",
  "Europe/Rome":"IT","Europe/Zagreb":"HR","Europe/Ljubljana":"SI","Europe/Prague":"CZ","Europe/Bratislava":"SK",
  "Europe/Budapest":"HU","Europe/Athens":"GR","Asia/Nicosia":"CY","Europe/Nicosia":"CY","Europe/Malta":"MT",
  "Europe/Bucharest":"RO","Europe/Sofia":"BG","Atlantic/Reykjavik":"IS"
};
let REGION = {land:null, quelle:"unbekannt"};   /* erkanntes Land für EN */
let REGION_MANUELL = false;

function landAusBrowser(){
  try{
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if (TZ_LAND[tz]) return {land:TZ_LAND[tz], quelle:"zeitzone"};
  }catch(_){}
  for (const l of (navigator.languages || [navigator.language||""])){
    const m = /^[a-z]{2,3}-([A-Z]{2})$/i.exec(l);
    if (m && CFG.mwst[m[1].toUpperCase()] !== undefined) return {land:m[1].toUpperCase(), quelle:"browsersprache"};
  }
  return {land:null, quelle:"unbekannt"};
}
async function regionErkennen(){
  REGION = landAusBrowser();
  /* Backend kann das Land aus der IP liefern (CDN-Header) — hat Vorrang, wenn vorhanden */
  try{
    const r = await fetch("/api/region", {signal:AbortSignal.timeout(2000)});
    if (r.ok){ const j = await r.json(); if (j.land && CFG.mwst[j.land] !== undefined) REGION = {land:j.land, quelle:"ip"}; }
  }catch(_){ /* Mockup ohne Backend */ }
}
async function fxLaden(){
  try{
    const r = await fetch("/api/fx", {signal:AbortSignal.timeout(2500)});
    if (r.ok){ const j = await r.json(); Object.assign(CFG.fx.kurse, j.kurse || {}); CFG.fx.quelle = j.quelle || "config"; }
  }catch(_){ /* Mockup ohne Backend: Konfig-Kurse */ }
}

/* ============ Kalkulation ============ */
function flaeche(){
  const L = +$("lwl").value, B = +$("breite").value, f = $("bootstyp").value;
  if (PROD === "det") return Math.round(CFG.detailing.formeln[f] * L * B * 10) / 10;
  return Math.round(CFG.formeln[f] * L * (B + (+$("tiefgang").value)) * 10) / 10;
}
/* gemeinsame Ausgabe: Netto-Spanne → Brutto mit Satz des Landes */
function packe(netto, a, tage, minNetto){
  const r = mwstSatz(), f = 1 + (r || 0);
  const r10 = x => Math.round(x/10)*10;
  const nv = Math.max(minNetto, netto*(1-CFG.spanne)), nb = Math.max(minNetto, netto*(1+CFG.spanne));
  return {
    flaeche:a, land:aktivesLand(), mwst_satz:r,
    netto_von:r10(nv), netto_bis:r10(nb),
    von:r10(nv*f), bis:r10(nb*f),   /* angezeigt = brutto */
    tageVon:tage, tageBis:tage+1
  };
}
function kalkuliere(pkgKey){
  if (PROD === "det") return kalkuliereDet(pkgKey);
  const p = CFG.pakete[pkgKey], a = flaeche(), z = CFG.zustand[$("zustand").value];
  let kosten = 0, stunden = 0;
  for (const k of p.entfernung){
    const m = CFG.entfernung[k], h = a / m.m2_h * z;
    stunden += h; kosten += h * m.eur_h + a * m.mat_m2;
  }
  for (const [k, s] of Object.entries(p.aufbau)){
    const c = CFG.aufbau[k], h = a / c.m2_h * s;
    stunden += h; kosten += h * c.eur_h + a * c.l_m2 * s * c.eur_l;
  }
  const mf = CFG.material[$("material").value] ?? 1;
  const netto = (kosten * mf + CFG.ruestpauschale_eur) * CFG.marge_faktor;
  const tage = Math.max(1, Math.ceil(stunden / CFG.arbeitsstunden_pro_tag)) + p.trocknungstage;
  return packe(netto, a, tage, 0);
}
function kalkuliereDet(pkgKey){
  const D = CFG.detailing, p = D.pakete[pkgKey], a = flaeche(), z = D.zustand[$("zustand").value];
  let kosten = 0, stunden = 0;
  for (const k of p.schritte){
    const m = D.schritte[k], h = a / m.m2_h * (m.z ? z : 1);
    stunden += h; kosten += h * m.eur_h + a * m.mat_m2;
  }
  const mf = CFG.material[$("material").value] ?? 1;
  const netto = (kosten * mf + CFG.ruestpauschale_eur) * CFG.marge_faktor;
  const tage = Math.max(1, Math.ceil(stunden / D.arbeitsstunden_pro_tag)) + p.trocknungstage;
  return packe(netto, a, tage, D.mindestauftrag_eur);   /* Mindestauftragswert je Anfahrt */
}

/* Abo: Netto vor Spanne oder null (kein Abo möglich) */
function aboNetto(pkgKey){
  const a = flaeche(), mf = CFG.material[$("material").value] ?? 1;
  if (PROD === "det"){
    const D = CFG.detailing; let k = 0;
    for (const s of CFG.abo.det.schritte[pkgKey]){ const m = D.schritte[s]; k += a / m.m2_h * m.eur_h + a * m.mat_m2; }
    return {netto:(k * mf + CFG.ruestpauschale_eur) * CFG.marge_faktor, min:D.mindestauftrag_eur};
  }
  const A = CFG.abo.uws; if (A.ohne.includes(pkgKey)) return null;
  const r = A.reinigung, c = CFG.aufbau.antifouling, fl = a * A.ausbesserung_anteil;
  let k = a / r.m2_h * r.eur_h + a * r.mat_m2 + A.pruefung_h * A.pruefung_eur_h;
  k += fl / c.m2_h * c.eur_h + fl * c.l_m2 * c.eur_l;
  return {netto:(k * mf + CFG.ruestpauschale_eur) * CFG.marge_faktor, min:A.min_netto};
}
function kalkuliereAbo(pkgKey){
  const x = aboNetto(pkgKey); if (!x) return null;
  const r = mwstSatz(), f = 1 + (r || 0), r10 = v => Math.round(v/10)*10;
  const nv = Math.max(x.min, x.netto*(1-CFG.spanne)), nb = Math.max(x.min, x.netto*(1+CFG.spanne));
  return {netto_von:r10(nv), netto_bis:r10(nb), von:r10(nv*f), bis:r10(nb*f)};
}

/* ---------- Medien (min. 3 Fotos oder 1 Video) ---------- */
const isImg = f => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name);
const isVid = f => f.type.startsWith("video/") || /\.(mp4|mov|m4v|webm)$/i.test(f.name);
const mediaCounts = () => ({p:FILES.filter(isImg).length, v:FILES.filter(isVid).length});
const mediaOk = () => { const c = mediaCounts(); return c.p >= 3 || c.v >= 1; };

function renderMedia(msg){
  const t = T(), c = mediaCounts();
  $("thumbs").innerHTML = FILES.map((f,i)=>`<div class="th">${isImg(f) ? `<img src="${URLS.get(f)}" alt="" onerror="this.remove()">` : ""}<span>${isVid(f) ? "▶ " : ""}${f.name.slice(0,22)}</span><button type="button" data-i="${i}" aria-label="×">×</button></div>`).join("");
  $("thumbs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    const f = FILES.splice(+b.dataset.i,1)[0]; URL.revokeObjectURL(URLS.get(f)); URLS.delete(f); renderMedia();
  }));
  const st = $("mStat");
  if (msg){ st.textContent = msg; st.className = "mstat bad"; return; }
  st.textContent = t.mediaCount.replace("{p}", c.p).replace("{v}", c.v) + (mediaOk() ? " · " + t.mediaOk : "");
  st.className = "mstat" + (mediaOk() ? " good" : "");
}
function addFiles(list){
  let msg = "";
  for (const f of list){
    if (!isImg(f) && !isVid(f)) { msg = T().errSize; continue; }
    if (f.size > (isVid(f) ? MAX_VID : MAX_IMG)) { msg = T().errSize; continue; }
    if (FILES.length >= MAX_FILES) { msg = T().errMax; break; }
    FILES.push(f); URLS.set(f, URL.createObjectURL(f));
  }
  renderMedia(msg);
}

/* ---------- Buchungskalender ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso = x => { const [y,m,d] = x.split("-").map(Number); return new Date(y, m-1, d); };
const fmtD = d => d.toLocaleDateString(T().locale, {day:"2-digit", month:"2-digit", year:"numeric"});
const istArbeitstag = d => d.getDay() !== 0 && d.getDay() !== 6;
function startMin(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + CFG.kalender.vorlauf_tage); return d; }
const buchbar = d => d >= startMin() && istArbeitstag(d) && !CFG.kalender.gesperrt.includes(iso(d));
function fensterEnde(start, tage){
  const d = new Date(start); let n = 1;
  while (n < tage){ d.setDate(d.getDate()+1); if (istArbeitstag(d)) n++; }
  return d;
}
function renderCal(){
  const t = T(), K = CFG.kalender, min = startMin();
  if (!CAL.view) CAL.view = new Date(min.getFullYear(), min.getMonth(), 1);
  const v = CAL.view, last = new Date(v.getFullYear(), v.getMonth()+1, 0);
  const lead = (new Date(v.getFullYear(), v.getMonth(), 1).getDay() + 6) % 7;
  const wd = [...Array(7)].map((_,i)=> new Date(2024,0,1+i).toLocaleDateString(t.locale,{weekday:"short"}).slice(0,2));
  const range = CAL.sel ? [parseIso(CAL.sel), fensterEnde(parseIso(CAL.sel), LAST_TAGE)] : null;
  let cells = "";
  for (let i=0;i<lead;i++) cells += "<span></span>";
  for (let n=1;n<=last.getDate();n++){
    const d = new Date(v.getFullYear(), v.getMonth(), n), id = iso(d), ok = buchbar(d), c = ["cal-d"];
    if (ok) c.push("ok");
    if (CAL.sel === id) c.push("on"); else if (range && d >= range[0] && d <= range[1]) c.push("in");
    cells += `<button type="button" class="${c.join(" ")}" data-d="${id}"${ok?"":" disabled"}>${n}</button>`;
  }
  const prevOk = v > new Date(min.getFullYear(), min.getMonth(), 1);
  const nextOk = new Date(v.getFullYear(), v.getMonth()+1, 1) < new Date(min.getFullYear(), min.getMonth()+K.max_monate, 1);
  $("cal").innerHTML = `<div class="cal-h"><button type="button" id="calPrev"${prevOk?"":" disabled"} aria-label="‹">‹</button>
    <span>${v.toLocaleDateString(t.locale,{month:"long",year:"numeric"})}</span>
    <button type="button" id="calNext"${nextOk?"":" disabled"} aria-label="›">›</button></div>
    <div class="cal-g">${wd.map(w=>`<div class="cal-w">${w}</div>`).join("")}${cells}</div>`;
  $("calPrev").onclick = ()=>{ CAL.view = new Date(v.getFullYear(), v.getMonth()-1, 1); renderCal(); };
  $("calNext").onclick = ()=>{ CAL.view = new Date(v.getFullYear(), v.getMonth()+1, 1); renderCal(); };
  $("cal").querySelectorAll(".cal-d.ok").forEach(b=>b.addEventListener("click",()=>{ CAL.sel = b.dataset.d; renderCal(); }));
  $("calSel").textContent = range ? t.calSel.replace("{s}", fmtD(range[0])).replace("{e}", fmtD(range[1])) : t.calNone;
  $("calSel").className = "mstat" + (range ? " good" : "");
}

/* ---------- Ergebnis (live) ---------- */
function zeigeErgebnis(pkg){   /* pkg = Paketschlüssel des aktiven Produkts */
  const t = T(), d = kalkuliere(pkg);
  LAST_TAGE = d.tageBis;
  letzteKalkulation = {produkt:PROD === "det" ? "detailing" : "unterwasserschiff", paket:pkg, sprache:LANG, flaeche_m2:d.flaeche, material:$("material").value,
    boot_vorlage:$("bootSelect").value === "other" ? "andere" : $("bootSelect").value,
    land:d.land, land_quelle:CFG.sprache_land[LANG] ? "sprache" : (REGION_MANUELL ? "manuell" : REGION.quelle),
    mwst_satz:d.mwst_satz,
    preis_netto_von:d.netto_von, preis_netto_bis:d.netto_bis,
    preis_brutto_von:d.mwst_satz === null ? null : d.von, preis_brutto_bis:d.mwst_satz === null ? null : d.bis,
    tage:`${d.tageVon}-${d.tageBis}`,
    boot:{lwl:+$("lwl").value, breite:+$("breite").value, tiefgang:+$("tiefgang").value,
          rumpf:$("bootstyp").value, zustand:$("zustand").value}};
  renderRegion();
  const w = waehrung(), shownVon = conv(d.von), shownBis = conv(d.bis);
  letzteKalkulation.waehrung = w; letzteKalkulation.kurs = w === "EUR" ? 1 : kurs(); letzteKalkulation.kurs_quelle = CFG.fx.quelle;
  letzteKalkulation.preis_anzeige_von = shownVon; letzteKalkulation.preis_anzeige_bis = shownBis;
  $("preisSpanne").textContent = spanneTxt(shownVon, shownBis);
  $("netLine").textContent = d.mwst_satz === null ? "" : `${t.net}: ${spanneTxt(conv(d.netto_von), conv(d.netto_bis))}`;
  /* Abo */
  const ab = kalkuliereAbo(pkg);
  $("aboBox").style.display = ab ? "" : "none";

$("leadBtn").addEventListener("click", async ()=>{
  const err = $("leadErr"), t = T();
  const fail = m => { err.textContent = m; err.style.display = "block"; };
  if(!$("lName").value.trim() || !$("lEmail").value.trim()) return fail(t.errReq);
  if(!/^[0-9A-Za-z][0-9A-Za-z\- ]{2,7}$/.test($("lPlz").value.trim())) return fail(t.errZip);
  if($("bootSelect").value === "other" && !$("lOther").value.trim()) return fail(t.errOther);
  if(!mediaOk()) return fail(t.errMedia);
  if(!CAL.sel) return fail(t.errDate);
  if(!CHECK.marina || !CHECK.pay || (needsOsmose() && !CHECK.osmose)) return fail(t.errConfirm);
  err.style.display = "none";
  const data = {name:$("lName").value, email:$("lEmail").value, plz:$("lPlz").value.trim(),
    telefon:$("lTel").value, nachricht:$("lMsg").value, wunschtermin:CAL.sel,
    groesse_freitext:$("bootSelect").value === "other" ? $("lOther").value.trim() : "",
    bestaetigungen:{osmosefrei:needsOsmose() ? CHECK.osmose : null, marina_selbst:CHECK.marina, anzahlung_50:CHECK.pay},
    abo:{angefragt:!!(letzteKalkulation.abo && letzteKalkulation.abo.verfuegbar && ABO.chk)},
    kalkulation:letzteKalkulation};
  $("leadBtn").disabled = true;
  const fertig = () => { $("leadBtn").disabled = false; $("leadBtn").textContent = t.fSend; };
  try {
    const medien = [];
    for (let i = 0; i < FILES.length; i++){
      $("leadBtn").textContent = (NEU[LANG]||NEU.de).up.replace("{i}", i+1).replace("{n}", FILES.length);
      medien.push(await Boatsdoc.upload(FILES[i]));
    }
    data.eigner = {name:data.name, email:data.email, plz:data.plz, telefon:data.telefon, nachricht:data.nachricht, sprache:LANG};
    data.medien = medien;
    data.probe = PROBE;
    const r = await Boatsdoc.call("POST", "/api/public/" + encodeURIComponent(SLUG) + "/anfragen", data);
    const link = Boatsdoc.url("angebot.html", {t:r.token});
    $("leadForm").style.display = "none";
    $("leadOk").style.display = "";
    $("leadOk").innerHTML = `${t.fThanks}<span class="code"><a href="${link}" target="_blank" rel="noopener">${(NEU[LANG]||NEU.de).status}</a></span>`;
    fertig();
  } catch(e){ fertig(); fail(e.message || t.errSend); }
});

async function ladePartner(){
  const q = new URLSearchParams(location.search);
  SLUG = q.get("p") || window.BD_PARTNER || "marina-schleibucht";
  try { PARTNER = await Boatsdoc.call("GET", "/api/public/" + encodeURIComponent(SLUG)); }
  catch(e){ document.querySelector("main").innerHTML = `<p class="gone">${(NEU[LANG]||NEU.de).gone}</p>`; document.body.classList.remove("lade"); return false; }
  const P = PARTNER, K = Boatsdoc.core.kalkCfg(P.preise);
  CFG.ruestpauschale_eur = K.ruestpauschale_eur; CFG.spanne = K.spanne; CFG.anfahrt_eur_pro_km = K.anfahrt_eur_pro_km;
  CFG.entfernung = K.entfernung; CFG.aufbau = K.aufbau;
  const f = (K.det_h || 100) / 100;
  for (const st of Object.values(CFG.detailing.schritte)) { st.eur_h_basis = st.eur_h_basis || st.eur_h; st.eur_h = Math.round(st.eur_h_basis * f); }
  CFG.detailing.mindestauftrag_eur = K.det_min || CFG.detailing.mindestauftrag_eur;
  /* MwSt. und Währung nach dem Ort der Arbeit (Land der Marina), nicht nach der Sprache des Eigners */
  for (const l in CFG.sprache_land) CFG.sprache_land[l] = P.land;
  REGION = {land:P.land, quelle:"marina"};
  CFG.kalender.vorlauf_tage = (P.kalender && P.kalender.vorlauf_tage) || 14;
  CFG.kalender.gesperrt = (P.kalender && P.kalender.gesperrt) || [];
  if (P.pakete && P.pakete[SEL.uws] === false) SEL.uws = ["af","full","strip"].find(k => P.pakete[k] !== false) || "af";
  if (!(P.detailing && P.detailing.aktiv)) PROD = "uws";
  if (!q.get("lang") && !localStorageLang() && SPR6.includes(P.sprache)) LANG = P.sprache;
  if (q.get("lang") && SPR6.includes(q.get("lang"))) LANG = q.get("lang");
  document.getElementById("pName").textContent = P.name;
  if (P.logo) { const im = document.createElement("img"); im.src = P.logo; im.alt = ""; const lg = document.getElementById("pLogo"); lg.querySelector("i").replaceWith(im); }
  PROBE = q.get("probe") === "1";

  const r = document.documentElement.style;
  r.setProperty("--acc", P.farbe); r.setProperty("--acc2", `color-mix(in srgb, ${P.farbe} 80%, #fff)`); r.setProperty("--accsoft", `color-mix(in srgb, ${P.farbe} 50%, #fff)`);
  /* White-Label: Hintergrundfarbe und Schrift des Partners */
  const D = P.design || {};
  if (/^#[0-9a-fA-F]{6}$/.test(D.bg || "")) {
    const m = (p, w) => `color-mix(in srgb, ${D.bg} ${p}%, ${w})`;
    r.setProperty("--bg", D.bg); r.setProperty("--bg2", m(92, "#fff")); r.setProperty("--panel", m(86, "#fff")); r.setProperty("--panel2", m(80, "#fff"));
    r.setProperty("--line", m(70, "#fff")); r.setProperty("--line2", m(62, "#fff"));
    const top = document.querySelector(".top"); if (top) top.style.background = `color-mix(in srgb, ${D.bg} 92%, transparent)`;
  }
  if (D.akzent2 && /^#[0-9a-fA-F]{6}$/.test(D.akzent2)) r.setProperty("--ok", D.akzent2);
  const SCHRIFTEN = ["Catamaran","Playfair Display","Source Sans 3","Open Sans","Lato","Montserrat","Roboto","Nunito Sans","Raleway","Work Sans"];
  if (SCHRIFTEN.includes(D.schrift)) {
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(D.schrift) + ":wght@400;600;700;800&display=swap"; document.head.appendChild(l);
    r.setProperty("--sans", `"${D.schrift}", system-ui, sans-serif`);
  }
  /* Impressum des Betreibers dieses Rechners */
  if (P.impressum && P.impressum.firma) {

    f.appendChild(a);
  }
  return true;
}
