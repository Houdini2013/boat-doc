<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ihr Angebot</title>

<style>
/* Layout: eine Spalte wie ein Auftragsschein — Marina oben, Stand, Angebot, Entscheidung. */
:root{
  color-scheme:light; --mc:#0E6E6A;
  --paper:#EEF0EC; --card:#FFFFFF; --ink:#10201F; --ink-2:#3D4F4E; --ink-3:#647572; --line:#CDD3CF; --line-2:#E1E5E1;
  --good:#256B4E; --good-soft:#DDEBE2; --warn:#8A5D0C; --warn-soft:#F4E8CF; --bad:#8C3A2E; --bad-soft:#F3DEDA;
  --f-disp:"Archivo",ui-sans-serif,system-ui,sans-serif; --f-body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark; --paper:#0B1614; --card:#132321; --ink:#E6EBE7; --ink-2:#AFBDB8; --ink-3:#83948F; --line:#2A3F3B; --line-2:#1C2E2B; --good:#5CB88C; --good-soft:#12291F; --warn:#D9A54A; --warn-soft:#2E2410; --bad:#E08476; --bad-soft:#36191A}}
:root[data-theme="dark"]{color-scheme:dark; --paper:#0B1614; --card:#132321; --ink:#E6EBE7; --ink-2:#AFBDB8; --ink-3:#83948F; --line:#2A3F3B; --line-2:#1C2E2B; --good:#5CB88C; --good-soft:#12291F; --warn:#D9A54A; --warn-soft:#2E2410; --bad:#E08476; --bad-soft:#36191A}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--f-disp); margin:0; letter-spacing:-.02em; line-height:1.15; text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.1rem}
p{margin:0}
.wrap{max-width:640px; margin:0 auto; padding-block:0 60px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:16px}
.band{background:var(--mc); color:#fff}
.band .in{max-width:640px; margin:0 auto; padding-block:18px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; align-items:center; gap:12px}
.band b{font-family:var(--f-disp); font-weight:800; font-size:1.1rem}
.band select{margin-left:auto; background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:3px; padding:5px 8px; font:inherit; font-size:.85rem}
.band select option{color:#10201F}
.eye{font-family:var(--f-mono); font-size:.66rem; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.card{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:18px; display:flex; flex-direction:column; gap:12px}
.steps{list-style:none; margin:0; padding:0; display:grid; gap:0}
.steps li{display:grid; grid-template-columns:22px 1fr; gap:10px; padding:7px 0; color:var(--ink-3); font-size:.95rem}
.steps li::before{content:""; width:12px; height:12px; border-radius:50%; border:2px solid var(--line); margin-top:5px; justify-self:center}
.steps li.done{color:var(--ink)} .steps li.done::before{background:var(--mc); border-color:var(--mc)}
.steps li.now{color:var(--ink); font-weight:600} .steps li.now::before{border-color:var(--mc); box-shadow:0 0 0 4px color-mix(in srgb,var(--mc) 22%,transparent)}
.steps small{display:block; font-weight:400; color:var(--ink-3); font-size:.82rem}
.big{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:2rem; font-weight:600; letter-spacing:-.03em; line-height:1.1}
table{width:100%; border-collapse:collapse; font-size:.92rem}
td{padding:7px 0; border-top:1px solid var(--line-2); vertical-align:top}
td:last-child{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.opts{display:grid; gap:10px}
.opt{all:unset; box-sizing:border-box; cursor:pointer; border:1px solid var(--line); border-radius:4px; padding:14px; display:grid; grid-template-columns:1fr auto; gap:3px 12px; background:var(--card)}
.opt:hover{border-color:var(--mc)}
.opt[aria-pressed="true"]{border-color:var(--mc); box-shadow:inset 0 0 0 1px var(--mc)}
.opt b{font-family:var(--f-mono)} .opt small{grid-column:1/-1; color:var(--ink-3); font-size:.84rem}
.opt:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--mc); outline-offset:2px}
.btn{font:inherit; font-weight:600; border-radius:4px; padding:13px 16px; cursor:pointer; border:1px solid var(--mc); background:var(--mc); color:#fff; width:100%}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.bad{background:transparent; color:var(--bad); border-color:var(--bad)}
.btn:disabled{opacity:.5; cursor:wait}
.note{border-left:3px solid var(--mc); background:color-mix(in srgb,var(--mc) 8%,var(--card)); padding:11px 13px; border-radius:0 3px 3px 0; font-size:.92rem}
.note.good{border-color:var(--good); background:var(--good-soft)} .note.warn{border-color:var(--warn); background:var(--warn-soft)} .note.bad{border-color:var(--bad); background:var(--bad-soft)}
.err{color:var(--bad); font-size:.9rem}
.foot{font-size:.8rem; color:var(--ink-3)}
.sim{font-family:var(--f-mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--warn)}
</style></head><body>

const B = window.Boatsdoc, tok = new URLSearchParams(location.search).get("t");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let L = "de", D = null, WAHL = "anzahlung", FRAGE = false;
const t = (k, v) => { let s = (T[L] || T.de)[k] || T.de[k]; for (const [a, b] of Object.entries(v || {})) s = s.split("{"+a+"}").join(b); return s; };
const eur = (n, d) => (Number(n)||0).toLocaleString(LOC[L], {style:"currency", currency:"EUR", minimumFractionDigits:d ?? 0, maximumFractionDigits:d ?? 0});
const dat = s => s ? new Date(s + "T12:00:00").toLocaleDateString(LOC[L], {weekday:"short", day:"2-digit", month:"long", year:"numeric"}) : "–";

async function laden(){
  try { D = await B.call("GET", "/api/angebot/" + encodeURIComponent(tok || "")); }
  catch(_){ document.getElementById("w").innerHTML = `<div class="card"><p>${t("fehlt")}</p></div>`; return; }
  if (!laden.sprache) { laden.sprache = true; L = T[D.eigner.sprache] ? D.eigner.sprache : (T[D.partner.sprache] ? D.partner.sprache : "de"); }
  document.documentElement.style.setProperty("--mc", D.partner.farbe || "#0E6E6A");
  render();
}
async function aktion(pfad, body){
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  try { D = await B.call("POST", "/api/angebot/" + encodeURIComponent(tok) + pfad, body); FRAGE = false; render(); }
  catch(e){ render(); document.getElementById("err").textContent = e.message; }
}
function render(){
  document.documentElement.lang = L;
  document.title = D.partner.name + " · " + t("h");
  document.getElementById("mName").textContent = D.partner.name;
  const ls = document.getElementById("lang");
  ls.innerHTML = Object.keys(T).map(l => `<option value="${l}"${l===L?" selected":""}>${T[l].n}</option>`).join("");
  ls.onchange = () => { L = ls.value; render(); };
  const st = D.status, a = D.angebot, z = D.zahlung, k = D.kalkulation || {};
  const stufe = {neu:1, angebot:2, angenommen:3, bestaetigt:4, abgeschlossen:5}[st] || 0;
  const schritte = [["s1","s1s"],["s2","s2s"],["s3","s3s"],["s4","s4s"],["s5","s5s"]].map(([h,s],i)=>
    `<li class="${i+1 < stufe ? "done" : i+1 === stufe ? "now" : ""}"><span>${t(h)}<small>${t(s)}</small></span></li>`).join("");
  const ausf = D.ausfuehrer ? D.ausfuehrer.name : D.partner.name;
  let haupt = "";
  if (st === "neu") haupt = `<div class="note">${t("warte")}</div>
    <table><tr><td>${t("richt")}</td><td>${k.preis_brutto_von ? eur(k.preis_brutto_von)+" – "+eur(k.preis_brutto_bis) : "–"}</td></tr><tr><td>${t("wunsch")}</td><td>${dat(D.wunschtermin)}</td></tr></table>`;
  if (a && ["angebot","angenommen","bestaetigt","abgeschlossen"].includes(st)) haupt = `
    <div><div class="eye">${t("angebot")}</div><div class="big">${eur(a.brutto, 2)}</div><div class="foot">${t("inkl",{m:(a.mwst_satz*100).toLocaleString(LOC[L])})}</div>
      ${D.waehrung && D.waehrung.code !== "EUR" ? `<div class="foot">${t("approx",{x:(Math.round(a.brutto*D.waehrung.kurs/10)*10).toLocaleString(LOC[L],{style:"currency",currency:D.waehrung.code,maximumFractionDigits:0}), k:D.waehrung.kurs.toLocaleString(LOC[L])})}</div>` : ""}</div>
    <table><tr><td>${t("leistung")}</td><td style="font-family:inherit">${t(k.produkt === "detailing" ? "prod_det" : "prod_uws")} · ${t("pk_"+(k.paket||"af"))}</td></tr><tr><td>${t("netto")}</td><td>${eur(a.festpreis_netto,2)}</td></tr><tr><td>${t("mwst")}</td><td>${eur(a.brutto - a.festpreis_netto,2)}</td></tr>
      <tr><td>${t("termin")}</td><td>${dat(a.termin)}</td></tr>${a.tage ? `<tr><td>${t("dauer")}</td><td>${t("tage",{d:a.tage})}</td></tr>` : ""}
      ${D.ausfuehrer ? `<tr><td colspan="2" style="text-align:left;font-family:inherit">${t("ausf",{n:esc(D.ausfuehrer.name)})}</td></tr>` : ""}</table>
    ${a.notiz ? `<div class="note"><b>${t("notiz")}:</b> ${esc(a.notiz)}</div>` : ""}`;
  let entscheid = "";
  if (st === "angebot"){
    const f = D.finanzierung;
    entscheid = `<div class="card"><h2>${t("wahl")}</h2><div class="opts">
      <button class="opt" type="button" data-w="anzahlung" aria-pressed="${WAHL==="anzahlung"}"><span>${t("anz")}</span><b>${eur(a.anzahlung,2)}</b><small>${t("anzS")}</small></button>
      ${f ? `<button class="opt" type="button" data-w="finanzierung" aria-pressed="${WAHL==="finanzierung"}"><span>${t("fin",{a:f.anbieter})}</span><b>${eur(f.monatsrate,2)}</b><small>${t("finS",{r:eur(f.monatsrate,2), m:f.laufzeit, z:f.zins.toLocaleString(LOC[L])})}${f.rest > 0 ? t("finRest",{x:eur(f.rest,2)}) : ""}</small></button>` : ""}
    </div><button class="btn" type="button" id="ja">${t("annehmen")}</button><button class="btn ghost" type="button" id="nein">${t("ablehnen")}</button>
    <p class="sim">${t("sim")}</p><p class="err" id="err"></p></div>`;
  }
  if (st === "angenommen") entscheid = `<div class="note good">${t("angenommen",{b:eur(z.betrag,2), f:esc(ausf)})}</div>
    <div class="card">${FRAGE ? `<p>${t("stornoQ")}</p><button class="btn bad" type="button" id="stJa">${t("ja")}</button><button class="btn ghost" type="button" id="stNein">${t("nein")}</button>` : `<button class="btn ghost" type="button" id="st">${t("storno")}</button>`}<p class="err" id="err"></p></div>`;
  if (st === "bestaetigt") entscheid = `<div class="note good">${t("bestaetigt")}</div>`;
  if (st === "abgeschlossen") entscheid = `<div class="note good">${t("erledigt")}</div>`;
  if (st === "storniert") entscheid = `<div class="note warn">${t("storniert",{b:eur(z ? z.betrag : 0,2)})}</div>`;
  if (st === "abgelehnt") entscheid = `<div class="note bad">${t("abgelehnt")}</div>`;
  const kont = [D.partner.kontakt.tel, D.partner.kontakt.web].filter(Boolean).map(esc).join(" · ");
  document.getElementById("w").innerHTML = `
    <div style="padding-top:20px"><div class="eye">${esc(D.eigner.name)}</div><h1>${t("h")}</h1></div>
    ${D.probe ? `<div class="note warn">${t("probe")}</div>` : ""}
    <div class="card">${haupt}</div>
    ${entscheid}
    <div class="card"><div class="eye">${t("stand")}</div><ol class="steps">${schritte}</ol></div>
    ${kont ? `<p class="foot">${t("kontakt",{n:kont})}</p>` : ""}`;
  document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { WAHL = b.dataset.w; render(); });
  const on = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = fn; };
  on("ja", () => aktion("/annehmen", {zahlart:WAHL}));
  on("nein", () => aktion("/ablehnen"));
  on("st", () => { FRAGE = true; render(); });
  on("stNein", () => { FRAGE = false; render(); });
  on("stJa", () => aktion("/stornieren"));
}
laden();
setInterval(() => { if (D && !document.hidden && !FRAGE) laden(); }, 15000);
</script>
</body></html>
